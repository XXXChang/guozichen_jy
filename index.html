<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guozichen_jy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景粒子 */
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }

        /* 主内容 */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* 头像 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(100, 255, 218, 0.5);
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.8);
        }

        /* 标题 */
        h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        /* 打字机效果 */
        .subtitle {
            font-size: 18px;
            color: #64ffda;
            margin-bottom: 40px;
            min-height: 24px;
        }

        /* 链接卡片 */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            max-width: 600px;
        }

        .link-card {
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .link-card:hover {
            transform: translateY(-4px);
            border-color: #64ffda;
            box-shadow: 0 8px 30px rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }

        /* 底部 */
        .footer {
            position: fixed;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="avatar" onclick="this.style.transform='scale(0.9)'">👋</div>
        <h1>guozichen_jy</h1>
        <div class="subtitle" id="subtitle"></div>
        <div class="links">
            <a href="https://github.com" class="link-card">GitHub</a>
            <a href="#" class="link-card">博客</a>
            <a href="#" class="link-card">项目</a>
            <a href="#" class="link-card">关于</a>
        </div>
    </div>

    <div class="footer">guozichen_jy · 2026</div>

    <script>
        // 打字机
        const texts = ["Welcome to my page", "欢迎来到我的主页", "Let's build something great"];
        let textIndex = 0, charIndex = 0, isDeleting = false;
        const el = document.getElementById('subtitle');

        function type() {
            const current = texts[textIndex];
            el.textContent = isDeleting
                ? current.substring(0, charIndex--)
                : current.substring(0, charIndex++);
            let delay = isDeleting ? 50 : 100;
            if (!isDeleting && charIndex === current.length) {
                delay = 2000; isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false; textIndex = (textIndex + 1) % texts.length;
                delay = 400;
            }
            setTimeout(type, delay);
        }
        type();

        // 粒子背景
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 80 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2 + 1,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5
        }));

        function draw() {
            ctx.fillStyle = 'rgba(15,15,35,0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(100,255,218,0.6)';
                ctx.fill();
            });
            // 连线
            particles.forEach((a, i) => {
                particles.slice(i + 1).forEach(b => {
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < 150) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(100,255,218,${0.2 - d / 750})`;
                        ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(draw);
        }
        draw();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
