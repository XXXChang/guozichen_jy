<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guozichen_jy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e3f2fd 30%, #d6e9f8 60%, #c5dff5 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景粒子 */
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }

        /* 主内容 */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* 双头像组合 */
        .avatar-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            background: linear-gradient(135deg, #64b5f6, #42a5f5, #1e88e5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 8px 32px rgba(100, 181, 246, 0.4), 0 0 60px rgba(100, 181, 246, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(100, 181, 246, 0.5), 0 0 80px rgba(100, 181, 246, 0.3);
        }
        .avatar-left {
            z-index: 2;
        }
        .avatar-right {
            margin-left: -25px;
            z-index: 1;
        }
        .heart-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            z-index: 3;
            filter: drop-shadow(0 2px 4px rgba(255, 100, 130, 0.4));
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* 标题 */
        h1 {
            font-size: 48px;
            color: #1565c0;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 8px rgba(21, 101, 192, 0.15);
            background: linear-gradient(135deg, #1976d2, #42a5f5, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 装饰 */
        .love-decor {
            font-size: 24px;
            margin: 8px 0 20px;
            letter-spacing: 12px;
            opacity: 0.8;
        }

        /* 打字机效果 */
        .subtitle {
            font-size: 18px;
            color: #1976d2;
            margin-bottom: 20px;
            min-height: 24px;
            font-weight: 500;
        }

        /* 纪念日卡片 - 右上角 */
        .memory-card {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 18px 28px;
            box-shadow: 0 8px 32px rgba(100, 181, 246, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(100, 181, 246, 0.4);
            text-align: center;
            min-width: 180px;
            transition: all 0.3s ease;
        }
        .memory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(100, 181, 246, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }
        .memory-label {
            font-size: 11px;
            color: #1976d2;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .memory-date {
            font-size: 12px;
            color: #64b5f6;
            margin-bottom: 8px;
        }
        .memory-count {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #1565c0, #1976d2, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
        }
        .memory-unit {
            font-size: 13px;
            color: #64b5f6;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* 链接卡片 */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            max-width: 600px;
        }

        .link-card {
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            color: #1565c0;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(100, 181, 246, 0.4);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.15);
        }
        .link-card:hover {
            transform: translateY(-4px);
            border-color: #1976d2;
            box-shadow: 0 8px 25px rgba(100, 181, 246, 0.3);
            color: #0d47a1;
            background: rgba(255, 255, 255, 0.9);
        }

        /* 底部 */
        .footer {
            position: fixed;
            bottom: 20px;
            color: rgba(100, 181, 246, 0.5);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="memory-card">
        <div class="memory-date">2026.09.12</div>
        <div class="memory-label">在一起已经</div>
        <div class="memory-count" id="daysCount">--</div>
        <div class="memory-unit">天</div>
    </div>

    <div class="content">
        <div class="avatar-group">
            <div class="avatar avatar-left" onclick="this.style.transform='scale(0.9)'">
                <img src="assets/gzc_jy_Img/HeadIcon1.jpg" alt="头像1">
            </div>
            <div class="heart-icon">💕</div>
            <div class="avatar avatar-right" onclick="this.style.transform='scale(0.9)'">
                <img src="assets/gzc_jy_Img/HeadIcon2.jpg" alt="头像2">
            </div>
        </div>
        <h1>GZC_JY</h1>
        <div class="subtitle" id="subtitle"></div>
    </div>

    <div class="footer">guozichen_jy · 2026</div>

    <script>
        // 打字机
        const texts = ["Welcome to my page", "欢迎来到我的主页", "Let's build something great"];
        let textIndex = 0, charIndex = 0, isDeleting = false;
        const el = document.getElementById('subtitle');

        function type() {
            const current = texts[textIndex];
            el.textContent = isDeleting
                ? current.substring(0, charIndex--)
                : current.substring(0, charIndex++);
            let delay = isDeleting ? 50 : 100;
            if (!isDeleting && charIndex === current.length) {
                delay = 2000; isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false; textIndex = (textIndex + 1) % texts.length;
                delay = 400;
            }
            setTimeout(type, delay);
        }
        type();

        // 计算纪念日天数
        function calculateDaysSince(dateStr) {
            const now = new Date();
            const past = new Date(dateStr);
            
            now.setHours(0, 0, 0, 0);
            past.setHours(0, 0, 0, 0);
            
            const diffTime = now - past;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            
            return diffDays;
        }

        // 格式化数字（带动画效果）
        function animateNumber(element, target) {
            const duration = 1500;
            const start = 0;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (target - start) * easeOut);
                
                element.textContent = current.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        // 初始化
        const daysSince = calculateDaysSince('2026-09-12');
        const daysElement = document.getElementById('daysCount');
        animateNumber(daysElement, daysSince);

        // 粒子背景 - 蓝色爱心飘落
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 50 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3 + 2,
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            color: ['#1976d2', '#2196f3', '#42a5f5', '#64b5f6', '#90caf9'][Math.floor(Math.random() * 5)]
        }));

        function drawHeart(x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.5);
            ctx.bezierCurveTo(x - s, y + s, x, y + s * 1.3, x, y + s * 1.5);
            ctx.bezierCurveTo(x, y + s * 1.3, x + s, y + s, x + s, y + s * 0.5);
            ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = 'rgba(240, 249, 255, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y > canvas.height) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }
                drawHeart(p.x, p.y, p.r, p.color, p.alpha);
            });
            requestAnimationFrame(draw);
        }
        draw();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
