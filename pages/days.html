<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纪念日详情</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #e3f2fd 30%, #d6e9f8 60%, #c5dff5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 48px;
            box-shadow: 0 8px 32px rgba(100, 181, 246, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(100, 181, 246, 0.4);
            min-width: 320px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(100, 181, 246, 0.35);
        }
        .card-title {
            font-size: 16px;
            color: #1976d2;
            letter-spacing: 4px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-date {
            font-size: 13px;
            color: #64b5f6;
            margin-bottom: 24px;
        }
        .main-count {
            font-size: 88px;
            font-weight: 700;
            background: linear-gradient(135deg, #1565c0, #1976d2, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
        }
        .main-unit {
            font-size: 18px;
            color: #64b5f6;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(100, 181, 246, 0.4), transparent);
            margin: 28px auto;
        }
        .next-section {
            text-align: left;
        }
        .next-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14px;
        }
        .next-label {
            color: #1976d2;
            font-weight: 500;
        }
        .next-value {
            background: linear-gradient(135deg, #1565c0, #1976d2, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 18px;
        }
        .next-date {
            color: #90caf9;
            font-size: 12px;
            margin-left: 8px;
        }
        .back {
            position: fixed;
            top: 24px;
            left: 24px;
            text-decoration: none;
            color: #1976d2;
            font-size: 16px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(100, 181, 246, 0.2);
            transition: all 0.3s ease;
        }
        .back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.3);
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">← 返回</a>
    <div class="container">
        <div class="card">
            <div class="card-title">在一起</div>
            <div class="card-date">2026.09.12</div>
            <div class="main-count" id="togetherCount">--</div>
            <div class="main-unit">天</div>
            <div class="divider"></div>
            <div class="next-section">
                <div class="next-item">
                    <span class="next-label">距离 100 天</span>
                    <span><span class="next-value" id="togetherHundred">--</span><span class="next-date">天</span></span>
                </div>
                <div class="next-item">
                    <span class="next-label">距离一周年</span>
                    <span><span class="next-value" id="togetherYear">--</span><span class="next-date">天</span></span>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">相识</div>
            <div class="card-date">2025.11.08</div>
            <div class="main-count" id="meetCount">--</div>
            <div class="main-unit">天</div>
            <div class="divider"></div>
            <div class="next-section">
                <div class="next-item">
                    <span class="next-label">距离 400 天</span>
                    <span><span class="next-value" id="meetHundred">--</span><span class="next-date">天</span></span>
                </div>
                <div class="next-item">
                    <span class="next-label">距离 2026.11.08</span>
                    <span><span class="next-value" id="meetYear">--</span><span class="next-date">天</span></span>
                </div>
            </div>
        </div>
    </div>
    <script>
        function calculateDaysSince(dateStr) {
            const start = new Date(dateStr);
            const today = new Date();
            start.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            const diff = today - start;
            return Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
        }
        function nextHundred(days) {
            return Math.ceil(days / 100) * 100;
        }
        function daysToHundred(days) {
            return nextHundred(days) - days;
        }
        function nextYearDate(dateStr) {
            const start = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let nextYear = start.getFullYear() + 1;
            let next = new Date(nextYear, start.getMonth(), start.getDate());
            while (next <= today) {
                nextYear += 1;
                next = new Date(nextYear, start.getMonth(), start.getDate());
            }
            return next;
        }
        function daysToDate(target) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diff = target - today;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        // 在一起
        const togetherDays = calculateDaysSince('2026-09-12');
        document.getElementById('togetherCount').textContent = togetherDays;
        document.getElementById('togetherHundred').textContent = daysToHundred(togetherDays);
        const togetherYear = nextYearDate('2026-09-12');
        document.getElementById('togetherYear').textContent = daysToDate(togetherYear);

        // 相识
        const meetDays = calculateDaysSince('2025-11-08');
        document.getElementById('meetCount').textContent = meetDays;
        document.getElementById('meetHundred').textContent = daysToHundred(meetDays);
        const meetYear = nextYearDate('2025-11-08');
        document.getElementById('meetYear').textContent = daysToDate(meetYear);
    </script>
</body>
</html>
