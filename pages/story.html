<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e7ecef">
    <title>我们的故事 | JY_GZC</title>
    <script src="../assets/data/memories.js"></script>
    <script>document.documentElement.classList.add('js');</script>
    <style>
        :root {
            --ink: #283741;
            --muted: #5d6d77;
            --line: #b5c1c8;
            --accent: #536f80;
            --silver: #788b98;
            --paper: #f8fafb;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                linear-gradient(112deg, rgba(255, 255, 255, 0.72) 0%, transparent 27%, rgba(255, 255, 255, 0.32) 48%, transparent 72%),
                linear-gradient(180deg, #f5f7f8 0%, #d5dde2 32%, #eef2f4 62%, #cbd4da 100%);
        }
        body.modal-open { overflow: hidden; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.2) 0 1px, rgba(62, 78, 89, 0.035) 1px 2px, transparent 2px 5px);
            opacity: 0.6;
        }
        main { position: relative; z-index: 2; }
        a { color: inherit; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
        .page-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            height: 68px;
            padding: 0 max(20px, calc((100% - 1080px) / 2));
            border-bottom: 1px solid rgba(80, 102, 115, 0.22);
            background: rgba(241, 245, 247, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 13px;
            font-weight: 600;
        }
        .page-nav a { text-decoration: none; }
        .page-nav a:hover { color: var(--accent); }
        .brand { letter-spacing: 1px; white-space: nowrap; }
        .nav-actions { display: flex; align-items: center; gap: 26px; }
        .nav-actions a { white-space: nowrap; }
        #storyPosition { color: var(--accent); font-variant-numeric: tabular-nums; }
        .intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: min(550px, 62vh);
            padding: 46px 24px 54px;
            text-align: center;
        }
        .portrait-pair {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .portrait-pair img {
            width: 104px;
            height: 104px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid var(--paper);
            outline: 1px solid rgba(77, 100, 113, 0.34);
            box-shadow: 0 12px 28px rgba(52, 71, 82, 0.2);
        }
        .portrait-pair img + img { margin-left: -17px; }
        .portrait-pair img:first-child { rotate: -7deg; }
        .portrait-pair img:last-child { rotate: 7deg; }
        .eyebrow {
            margin: 0 0 13px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
        }
        h1 {
            margin: 0;
            font-size: 48px;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-weight: 600;
            line-height: 1.2;
            text-shadow: 0 3px 18px rgba(71, 91, 102, 0.15);
        }
        .scroll-cue {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 45px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
        }
        .scroll-cue span {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border: 1px solid var(--silver);
            border-radius: 50%;
            font-size: 15px;
            animation: cueDown 2.4s ease-in-out infinite;
        }
        @keyframes cueDown {
            50% { transform: translateY(5px); }
        }
        .chapter-heading {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            width: min(100% - 40px, 1080px);
            margin: 0 auto 58px;
            padding-top: 26px;
            border-top: 1px solid rgba(80, 102, 115, 0.3);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .storyline {
            position: relative;
            width: min(100%, 1080px);
            margin: auto;
            padding: 0 32px 90px;
        }
        .storyline::before,
        .timeline-progress {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
        }
        .storyline::before {
            content: "";
            bottom: 90px;
            background: var(--line);
        }
        .timeline-progress {
            z-index: 1;
            height: 0;
            max-height: calc(100% - 90px);
            background: linear-gradient(90deg, #5d707d, #f7fafb 52%, #6f8390);
            transition: height 0.12s linear;
            pointer-events: none;
        }
        .story-event {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr);
            min-height: 150px;
        }
        .event-pin {
            z-index: 2;
            grid-column: 2;
            grid-row: 1;
            justify-self: center;
            width: 22px;
            height: 22px;
            border: 6px solid var(--paper);
            border-radius: 50%;
            background: linear-gradient(135deg, #f8fbfc, #778b98 62%, #435764);
            box-shadow: 0 0 0 1px var(--silver), 0 3px 10px rgba(52, 71, 82, 0.2);
            transition: transform 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
        }
        .story-event.is-current .event-pin {
            transform: scale(1.3);
            background: linear-gradient(135deg, #fff, #89a0ae 50%, #385363);
            box-shadow: 0 0 0 1px var(--accent), 0 0 0 8px rgba(83, 111, 128, 0.15);
        }
        .event-copy {
            grid-row: 1;
            max-width: 390px;
            min-height: 86px;
            padding: 23px 25px;
            border: 1px solid rgba(91, 113, 126, 0.3);
            border-top: 2px solid var(--silver);
            border-radius: 6px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.94), rgba(224, 232, 236, 0.9) 60%, rgba(250, 252, 253, 0.95));
            box-shadow: 0 12px 30px rgba(51, 71, 83, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        button.event-copy {
            appearance: none;
            -webkit-appearance: none;
            color: inherit;
            font: inherit;
            text-align: inherit;
            cursor: pointer;
        }
        button.event-copy:hover {
            border-color: rgba(83, 111, 128, 0.58);
            box-shadow: 0 17px 36px rgba(51, 71, 83, 0.17), inset 0 1px 0 rgba(255, 255, 255, 0.98);
            transform: translateY(-2px);
        }
        button.event-copy:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 5px;
        }
        .story-event.highlight .event-copy {
            border-color: rgba(83, 111, 128, 0.42);
            border-top-color: var(--accent);
            background: linear-gradient(120deg, #f9fbfc, #d9e3e9 65%, #f5f8fa);
            box-shadow: 0 14px 34px rgba(53, 75, 89, 0.17);
        }
        .story-event.is-linked .event-copy {
            border-color: var(--accent);
            box-shadow: 0 0 0 5px rgba(83, 111, 128, 0.13), 0 17px 38px rgba(51, 71, 83, 0.18);
        }
        .story-event.is-linked .event-pin {
            transform: scale(1.35);
            box-shadow: 0 0 0 1px var(--accent), 0 0 0 9px rgba(83, 111, 128, 0.16);
        }
        .story-event:nth-of-type(odd) .event-copy {
            grid-column: 1;
            justify-self: end;
            width: 100%;
            margin-right: 30px;
            text-align: right;
        }
        .story-event:nth-of-type(even) .event-copy {
            grid-column: 3;
            width: 100%;
            margin-left: 30px;
        }
        .js .event-copy {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .js .story-event.is-visible .event-copy {
            opacity: 1;
            transform: translateY(0);
        }
        .js .story-event.is-visible button.event-copy:hover { transform: translateY(-2px); }
        .event-meta {
            color: var(--ink);
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .story-dialog {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(24, 34, 40, 0.66);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);
        }
        .story-dialog-panel {
            position: relative;
            width: min(100%, 650px);
            max-height: min(82vh, 760px);
            overflow: auto;
            padding: 44px 42px 38px;
            border: 1px solid rgba(111, 132, 144, 0.5);
            border-radius: 7px;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.98), rgba(218, 228, 233, 0.97) 58%, rgba(248, 251, 252, 0.98));
            box-shadow: 0 28px 70px rgba(22, 34, 42, 0.32), inset 0 1px 0 #fff;
        }
        .dialog-close {
            position: absolute;
            top: 14px;
            right: 14px;
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid rgba(83, 111, 128, 0.35);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.58);
            color: var(--ink);
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }
        .dialog-close:hover { background: rgba(255, 255, 255, 0.9); }
        .dialog-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .detail-date {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-variant-numeric: tabular-nums;
        }
        .story-dialog h2 {
            margin: 0;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 34px;
            font-weight: 600;
        }
        .detail-location {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .detail-description {
            margin: 23px 0 0;
            color: var(--ink);
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .detail-photos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 25px;
        }
        .detail-photos img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 6px solid var(--paper);
            border-radius: 4px;
            box-shadow: 0 10px 24px rgba(44, 62, 72, 0.14);
        }
        .detail-albums {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 26px;
        }
        .detail-albums a {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 8px 13px;
            border: 1px solid rgba(83, 111, 128, 0.42);
            border-radius: 4px;
            color: var(--ink);
            font-size: 12px;
            font-weight: 650;
            text-decoration: none;
        }
        .detail-albums a:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
        .ending {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 54px 24px 105px;
            border-top: 1px solid rgba(91, 113, 126, 0.26);
            background: rgba(227, 234, 238, 0.7);
            text-align: center;
        }
        .ending::before {
            content: "♡";
            display: block;
            margin-bottom: 22px;
            color: var(--accent);
            font-size: 32px;
        }
        .ending h2 { margin: 0 0 14px; font-size: 27px; }
        .ending a {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid var(--silver);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .ending a:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
        @media (max-width: 700px) {
            .page-nav { height: 64px; }
            .nav-actions { gap: 14px; }
            .intro { min-height: min(490px, 62vh); padding: 38px 20px 48px; }
            .portrait-pair img { width: 82px; height: 82px; }
            h1 { font-size: 38px; }
            .scroll-cue { margin-top: 30px; }
            .chapter-heading { margin-bottom: 38px; }
            .storyline { padding: 0 20px 50px; }
            .storyline::before,
            .timeline-progress { left: 34px; }
            .storyline::before { bottom: 50px; }
            .timeline-progress { max-height: calc(100% - 50px); }
            .story-event {
                grid-template-columns: 28px minmax(0, 1fr);
                column-gap: 22px;
                min-height: 130px;
            }
            .event-pin { grid-column: 1; }
            .story-event:nth-of-type(n) .event-copy {
                grid-column: 2;
                width: 100%;
                max-width: none;
                margin: 0;
                text-align: left;
            }
            .event-copy { min-height: 76px; padding: 21px 18px; }
            .event-meta { font-size: 15px; }
            .story-dialog { padding: 14px; }
            .story-dialog-panel { padding: 42px 22px 28px; }
            .story-dialog h2 { font-size: 28px; }
            .detail-photos { gap: 8px; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .scroll-cue span { animation: none; }
            .js .event-copy { opacity: 1; transform: none; transition: none; }
            .event-pin, .timeline-progress, .ending a { transition: none; }
        }
    </style>
</head>
<body>
    <canvas id="fallingHearts" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>
    <canvas id="clickHearts" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;"></canvas>
    <nav class="page-nav" aria-label="页面导航">
        <a class="brand" href="../index.html">← JY_GZC</a>
        <div class="nav-actions">
            <span id="storyPosition" aria-label="当前故事进度">01 / --</span>
            <a href="days.html">日历 ↗</a>
        </div>
    </nav>

    <main>
        <section class="intro" aria-labelledby="story-title">
            <div class="portrait-pair">
                <img src="../assets/gzc_jy_Img/HeadIcon1.jpg" alt="JY 的头像">
                <img src="../assets/gzc_jy_Img/HeadIcon2.jpg" alt="GZC 的头像">
            </div>
            <p class="eyebrow">JY & GZC · OUR STORY</p>
            <h1 id="story-title">我们的故事</h1>
            <div class="scroll-cue" aria-hidden="true"><span>↓</span> 向下翻阅</div>
        </section>

        <div class="chapter-heading"><span>THE TIMELINE / 故事时间线</span><span id="storyYears">--</span></div>
        <section class="storyline" id="storyline" aria-label="关键时间节点">
            <div class="timeline-progress" aria-hidden="true"></div>
        </section>

        <section class="ending" aria-label="故事继续">
            <h2>故事未完待续</h2>
            <a href="days.html">查看我们的日历 ↗</a>
        </section>
    </main>

    <div id="storyDialog" class="story-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
        <section class="story-dialog-panel">
            <button id="closeStoryDialog" class="dialog-close" type="button" aria-label="关闭故事详情" title="关闭">×</button>
            <p id="detailDate" class="detail-date"></p>
            <h2 id="detailTitle"></h2>
            <p id="detailLocation" class="detail-location" hidden></p>
            <p id="detailDescription" class="detail-description" hidden></p>
            <div id="detailPhotos" class="detail-photos" hidden></div>
            <div id="detailAlbums" class="detail-albums" hidden></div>
        </section>
    </div>

    <script>
    // ============== 故事节点渲染（全站统一数据源） ==============
    (function () {
        const timeline = document.getElementById('storyline');
        const progress = timeline.querySelector('.timeline-progress');
        const position = document.getElementById('storyPosition');
        const storyYears = document.getElementById('storyYears');
        const dialog = document.getElementById('storyDialog');
        const closeDialogButton = document.getElementById('closeStoryDialog');
        const detailDate = document.getElementById('detailDate');
        const detailTitle = document.getElementById('detailTitle');
        const detailLocation = document.getElementById('detailLocation');
        const detailDescription = document.getElementById('detailDescription');
        const detailPhotos = document.getElementById('detailPhotos');
        const detailAlbums = document.getElementById('detailAlbums');
        const pageNav = document.querySelector('.page-nav');
        const pageMain = document.querySelector('main');
        const data = window.MEMORY_DATA || { events: [], photos: [], albums: [] };
        const events = data.events.filter(event => event.story === true);
        const photosById = new Map(data.photos.map(photo => [photo.id, photo]));
        const albumsById = new Map(data.albums.map(album => [album.id, album]));
        const eventsById = new Map(events.map(event => [event.id, event]));
        const articlesById = new Map();
        let lastFocused = null;

        function fmtDate(iso) {
            const [y, m, d] = iso.split('-');
            return { full: `${y}.${m}.${d}`, short: `${m}.${d}` };
        }

        function fmtLabel(ev) {
            if (ev.date) {
                return { text: fmtDate(ev.date).full, datetime: ev.date };
            }
            const s = fmtDate(ev.startDate);
            const e = fmtDate(ev.endDate || ev.startDate);
            const [sy, sm] = ev.startDate.split('-');
            const [ey, em] = (ev.endDate || ev.startDate).split('-');
            const text = (sy === ey && sm === em)
                ? `${s.full} - ${e.short}`
                : (sy === ey ? `${s.full} - ${e.short}` : `${s.full} - ${e.full}`);
            return { text, datetime: ev.startDate };
        }

        function hasDetails(event) {
            return Boolean(
                event.title?.trim() ||
                event.location?.trim() ||
                event.description?.trim() ||
                event.photoIds?.length ||
                event.albumIds?.length
            );
        }

        function setOptionalText(element, value) {
            const text = value?.trim() || '';
            element.textContent = text;
            element.hidden = !text;
        }

        function openDetails(event, trigger) {
            if (!hasDetails(event)) return;
            const { text } = fmtLabel(event);
            const relatedPhotos = (event.photoIds || []).map(id => photosById.get(id)).filter(Boolean);
            const relatedAlbums = (event.albumIds || []).map(id => albumsById.get(id)).filter(Boolean);

            detailDate.textContent = text;
            detailTitle.textContent = event.title?.trim() || event.tag?.trim() || '故事片段';
            setOptionalText(detailLocation, event.location ? `地点 · ${event.location}` : '');
            setOptionalText(detailDescription, event.description);

            detailPhotos.replaceChildren(...relatedPhotos.map(photo => {
                const image = document.createElement('img');
                image.src = '../' + photo.src.replace(/^\.?\//, '');
                image.alt = photo.alt || event.title || '故事照片';
                image.loading = 'eager';
                return image;
            }));
            detailPhotos.hidden = relatedPhotos.length === 0;

            detailAlbums.replaceChildren(...relatedAlbums.map(album => {
                const link = document.createElement('a');
                const relatedPhoto = relatedPhotos.find(photo => photo.albumIds?.includes(album.id));
                const params = new URLSearchParams({ album: album.id, event: event.id });
                if (relatedPhoto) params.set('photo', relatedPhoto.id);
                link.href = `photos.html?${params.toString()}`;
                link.textContent = `查看「${album.title}」相册 ↗`;
                return link;
            }));
            detailAlbums.hidden = relatedAlbums.length === 0;

            lastFocused = trigger || document.activeElement;
            dialog.hidden = false;
            document.body.classList.add('modal-open');
            pageNav.inert = true;
            pageMain.inert = true;
            closeDialogButton.focus();
        }

        function closeDetails() {
            if (dialog.hidden) return;
            dialog.hidden = true;
            document.body.classList.remove('modal-open');
            pageNav.inert = false;
            pageMain.inert = false;
            lastFocused?.focus({ preventScroll: true });
        }

        events.forEach(ev => {
            const { text, datetime } = fmtLabel(ev);
            const article = document.createElement('article');
            article.className = 'story-event' + (ev.highlight ? ' highlight' : '');
            article.id = `event-${ev.id}`;
            article.dataset.eventId = ev.id;

            const pin = document.createElement('span');
            pin.className = 'event-pin';
            pin.setAttribute('aria-hidden', 'true');

            const copy = document.createElement(hasDetails(ev) ? 'button' : 'div');
            copy.className = 'event-copy';
            if (copy instanceof HTMLButtonElement) {
                copy.type = 'button';
                copy.setAttribute('aria-label', `查看 ${text} 的故事详情`);
                copy.addEventListener('click', () => openDetails(ev, copy));
            }

            const meta = document.createElement('div');
            meta.className = 'event-meta';
            const time = document.createElement('time');
            time.dateTime = datetime;
            time.textContent = text;
            meta.appendChild(time);
            copy.appendChild(meta);
            article.append(pin, copy);
            timeline.appendChild(article);
            articlesById.set(ev.id, article);
        });

        const eventElements = [...document.querySelectorAll('.story-event')];
        const years = events
            .map(event => (event.date || event.startDate || '').slice(0, 4))
            .filter(Boolean);
        storyYears.textContent = years.length ? `${years[0]} - ${years[years.length - 1]}` : '--';

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
            eventElements.forEach(event => observer.observe(event));
        } else {
            eventElements.forEach(event => event.classList.add('is-visible'));
        }

        let scheduled = false;
        function updateTimeline() {
            const rect = timeline.getBoundingClientRect();
            const lineLength = timeline.clientHeight - (window.innerWidth <= 700 ? 50 : 90);
            const atEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
            const revealPoint = atEnd ? window.innerHeight : window.innerHeight * 0.52;
            progress.style.height = Math.max(0, Math.min(lineLength, revealPoint - rect.top)) + 'px';

            let current = -1;
            eventElements.forEach((event, index) => {
                if (event.querySelector('.event-pin').getBoundingClientRect().top <= revealPoint) {
                    current = index;
                }
                event.classList.toggle('is-current', index === current);
            });
            const shown = eventElements.length ? Math.max(1, current + 1) : 0;
            position.textContent = String(shown).padStart(2, '0') + ' / ' +
                String(eventElements.length).padStart(2, '0');
            scheduled = false;
        }
        function scheduleUpdate() {
            if (!scheduled) {
                scheduled = true;
                requestAnimationFrame(updateTimeline);
            }
        }
        window.addEventListener('scroll', scheduleUpdate, { passive: true });
        window.addEventListener('resize', scheduleUpdate);

        closeDialogButton.addEventListener('click', closeDetails);
        dialog.addEventListener('click', event => {
            if (event.target === dialog) closeDetails();
        });
        window.addEventListener('keydown', event => {
            if (dialog.hidden) return;
            if (event.key === 'Escape') {
                closeDetails();
                return;
            }
            if (event.key !== 'Tab') return;
            const focusable = [...dialog.querySelectorAll('button:not([disabled]), a[href]')]
                .filter(element => !element.hidden);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });

        updateTimeline();

        const requestedId = new URLSearchParams(window.location.search).get('event');
        const requestedEvent = requestedId ? eventsById.get(requestedId) : null;
        const requestedArticle = requestedId ? articlesById.get(requestedId) : null;
        if (requestedEvent && requestedArticle) {
            requestedArticle.classList.add('is-linked', 'is-visible');
            requestAnimationFrame(() => {
                requestedArticle.scrollIntoView({ behavior: 'auto', block: 'center' });
                const trigger = requestedArticle.querySelector('button.event-copy');
                if (trigger) setTimeout(() => openDetails(requestedEvent, trigger), 80);
            });
        }
    })();
    </script>

    <script>
    (function () {
        const canvas = document.getElementById('fallingHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        const palette = ['#677d8a', '#91a2ac', '#b3c0c8', '#758b99', '#a1b2bc'];
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const PARTICLE_COUNT = isMobile ? 22 : 50;
        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 2,
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function drawHeart(x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.5);
            ctx.bezierCurveTo(x - s, y + s, x, y + s * 1.3, x, y + s * 1.5);
            ctx.bezierCurveTo(x, y + s * 1.3, x + s, y + s, x + s, y + s * 0.5);
            ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
            ctx.fill();
            ctx.lineWidth = 0.6;
            ctx.strokeStyle = 'rgba(51, 68, 79, 0.45)';
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = window.innerWidth;
                if (p.x > window.innerWidth) p.x = 0;
                if (p.y > window.innerHeight) {
                    p.y = -10;
                    p.x = Math.random() * window.innerWidth;
                }
                drawHeart(p.x, p.y, p.r, p.color, p.alpha);
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

    <script>
    (function () {
        const canvas = document.getElementById('clickHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        function heartShape(s) {
            ctx.beginPath();
            ctx.moveTo(0, s * 0.3);
            ctx.bezierCurveTo(0, -s * 0.2, -s * 0.6, -s * 0.2, -s * 0.5, s * 0.2);
            ctx.bezierCurveTo(-s * 0.4, s * 0.6, 0, s * 0.8, 0, s);
            ctx.bezierCurveTo(0, s * 0.8, s * 0.4, s * 0.6, s * 0.5, s * 0.2);
            ctx.bezierCurveTo(s * 0.6, -s * 0.2, 0, -s * 0.2, 0, s * 0.3);
            ctx.closePath();
        }

        const palette = ['#8fa3af', '#b7c5cd', '#728996', '#a6b8c2', '#7c919e'];
        function Particle(x, y) {
            this.x = x; this.y = y;
            this.size = 12 + Math.random() * 12;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -(2 + Math.random() * 2.5);
            this.life = 1;
            this.decay = 0.01 + Math.random() * 0.012;
            this.angle = (Math.random() - 0.5) * 0.6;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.color = palette[Math.floor(Math.random() * palette.length)];
        }
        Particle.prototype.update = function () {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; this.vx *= 0.99;
            this.angle += this.spin; this.life -= this.decay;
        };
        Particle.prototype.draw = function () {
            ctx.save();
            ctx.globalAlpha = Math.max(this.life, 0);
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            const shine = ctx.createLinearGradient(-this.size * 0.6, 0, this.size * 0.6, this.size);
            shine.addColorStop(0, '#f8fcfd');
            shine.addColorStop(0.28, this.color);
            shine.addColorStop(0.55, '#e5edf1');
            shine.addColorStop(1, '#526773');
            ctx.fillStyle = shine;
            heartShape(this.size);
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(46, 65, 76, 0.7)';
            ctx.stroke();
            ctx.restore();
        };

        function spawn(x, y) {
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const r = Math.random() * 8;
                const p = new Particle(x + Math.cos(a) * r, y + Math.sin(a) * r);
                p.vx = Math.cos(a) * (1.2 + Math.random() * 1.5);
                p.vy = Math.sin(a) * (1.2 + Math.random() * 1.5) - 1.5;
                particles.push(p);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        let lastTouchTime = 0;
        window.addEventListener('click', event => {
            if (Date.now() - lastTouchTime < 600) return;
            spawn(event.clientX, event.clientY);
        });
        window.addEventListener('touchstart', event => {
            lastTouchTime = Date.now();
            const touch = event.touches[0];
            spawn(touch.clientX, touch.clientY);
        }, { passive: true });
    })();
    </script>
