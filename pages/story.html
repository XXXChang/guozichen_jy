         ============================================ -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e7ecef">

    <script>document.documentElement.classList.add('js');</script>
    <style>
        :root {
            --ink: #283741;
            --muted: #5d6d77;
            --line: #b5c1c8;
            --accent: #536f80;
            --silver: #788b98;
            --paper: #f8fafb;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                linear-gradient(112deg, rgba(255, 255, 255, 0.72) 0%, transparent 27%, rgba(255, 255, 255, 0.32) 48%, transparent 72%),
                linear-gradient(180deg, #f5f7f8 0%, #d5dde2 32%, #eef2f4 62%, #cbd4da 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.2) 0 1px, rgba(62, 78, 89, 0.035) 1px 2px, transparent 2px 5px);
            opacity: 0.6;
        }
        main { position: relative; z-index: 2; }
        a { color: inherit; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
        .page-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            height: 68px;
            padding: 0 max(20px, calc((100% - 1080px) / 2));
            border-bottom: 1px solid rgba(80, 102, 115, 0.22);
            background: rgba(241, 245, 247, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 13px;
            font-weight: 600;
        }
        .page-nav a { text-decoration: none; }
        .page-nav a:hover { color: var(--accent); }
        .brand { letter-spacing: 1px; white-space: nowrap; }
        .nav-actions { display: flex; align-items: center; gap: 26px; }
        .nav-actions a { white-space: nowrap; }
        #storyPosition { color: var(--accent); font-variant-numeric: tabular-nums; }
        .intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: min(550px, 62vh);
            padding: 46px 24px 54px;
            text-align: center;
        }
        .portrait-pair {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .portrait-pair img {
            width: 104px;
            height: 104px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid var(--paper);
            outline: 1px solid rgba(77, 100, 113, 0.34);
            box-shadow: 0 12px 28px rgba(52, 71, 82, 0.2);
        }
        .portrait-pair img + img { margin-left: -17px; }
        .portrait-pair img:first-child { rotate: -7deg; }
        .portrait-pair img:last-child { rotate: 7deg; }
        .eyebrow {
            margin: 0 0 13px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
        }
        h1 {
            margin: 0;
            font-size: 48px;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-weight: 600;
            line-height: 1.2;
            text-shadow: 0 3px 18px rgba(71, 91, 102, 0.15);
        }
        .scroll-cue {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 45px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
        }
        .scroll-cue span {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border: 1px solid var(--silver);
            border-radius: 50%;
            font-size: 15px;
            animation: cueDown 2.4s ease-in-out infinite;
        }
        @keyframes cueDown {
            50% { transform: translateY(5px); }
        }
        .chapter-heading {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            width: min(100% - 40px, 1080px);
            margin: 0 auto 58px;
            padding-top: 26px;
            border-top: 1px solid rgba(80, 102, 115, 0.3);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .storyline {
            position: relative;
            width: min(100%, 1080px);
            margin: auto;
            padding: 0 32px 90px;
        }
        .storyline::before,
        .timeline-progress {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
        }
        .storyline::before {
            content: "";
            bottom: 90px;
            background: var(--line);
        }
        .timeline-progress {
            z-index: 1;
            height: 0;
            max-height: calc(100% - 90px);
            background: linear-gradient(90deg, #5d707d, #f7fafb 52%, #6f8390);
            transition: height 0.12s linear;
            pointer-events: none;
        }
        .story-event {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr);
            min-height: 150px;
        }
        .event-pin {
            z-index: 2;
            grid-column: 2;
            grid-row: 1;
            justify-self: center;
            width: 22px;
            height: 22px;
            border: 6px solid var(--paper);
            border-radius: 50%;
            background: linear-gradient(135deg, #f8fbfc, #778b98 62%, #435764);
            box-shadow: 0 0 0 1px var(--silver), 0 3px 10px rgba(52, 71, 82, 0.2);
            transition: transform 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
        }
        .story-event.is-current .event-pin {
            transform: scale(1.3);
            background: linear-gradient(135deg, #fff, #89a0ae 50%, #385363);
            box-shadow: 0 0 0 1px var(--accent), 0 0 0 8px rgba(83, 111, 128, 0.15);
        }
        .event-copy {
            grid-row: 1;
            max-width: 390px;
            min-height: 86px;
            padding: 23px 25px;
            border: 1px solid rgba(91, 113, 126, 0.3);
            border-top: 2px solid var(--silver);
            border-radius: 6px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.94), rgba(224, 232, 236, 0.9) 60%, rgba(250, 252, 253, 0.95));
            box-shadow: 0 12px 30px rgba(51, 71, 83, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .story-event.highlight .event-copy {
            border-color: rgba(83, 111, 128, 0.42);
            border-top-color: var(--accent);
            background: linear-gradient(120deg, #f9fbfc, #d9e3e9 65%, #f5f8fa);
            box-shadow: 0 14px 34px rgba(53, 75, 89, 0.17);
        }
        .story-event:nth-of-type(odd) .event-copy {
            grid-column: 1;
            justify-self: end;
            width: 100%;
            margin-right: 30px;
            text-align: right;
        }
        .story-event:nth-of-type(even) .event-copy {
            grid-column: 3;
            width: 100%;
            margin-left: 30px;
        }
        .js .event-copy {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .js .story-event.is-visible .event-copy {
            opacity: 1;
            transform: translateY(0);
        }
        .event-meta {
            color: var(--ink);
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .ending {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 54px 24px 105px;
            border-top: 1px solid rgba(91, 113, 126, 0.26);
            background: rgba(227, 234, 238, 0.7);
            text-align: center;
        }
        .ending::before {
            content: "♡";
            display: block;
            margin-bottom: 22px;
            color: var(--accent);
            font-size: 32px;
        }
        .ending h2 { margin: 0 0 14px; font-size: 27px; }
        .ending a {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid var(--silver);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .ending a:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
        @media (max-width: 700px) {
            .page-nav { height: 64px; }
            .nav-actions { gap: 14px; }
            .intro { min-height: min(490px, 62vh); padding: 38px 20px 48px; }
            .portrait-pair img { width: 82px; height: 82px; }
            h1 { font-size: 38px; }
            .scroll-cue { margin-top: 30px; }
            .chapter-heading { margin-bottom: 38px; }
            .storyline { padding: 0 20px 50px; }
            .storyline::before,
            .timeline-progress { left: 34px; }
            .storyline::before { bottom: 50px; }
            .timeline-progress { max-height: calc(100% - 50px); }
            .story-event {
                grid-template-columns: 28px minmax(0, 1fr);
                column-gap: 22px;
                min-height: 130px;
            }
            .event-pin { grid-column: 1; }
            .story-event:nth-of-type(n) .event-copy {
                grid-column: 2;
                width: 100%;
                max-width: none;
                margin: 0;
                text-align: left;
            }
            .event-copy { min-height: 76px; padding: 21px 18px; }
            .event-meta { font-size: 15px; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .scroll-cue span { animation: none; }
            .js .event-copy { opacity: 1; transform: none; transition: none; }
            .event-pin, .timeline-progress, .ending a { transition: none; }
        }
    </style>
</head>

    <script>
    // ============== 故事节点渲染（数据源：顶部 #storyData） ==============
    (function () {
        const dataEl = document.getElementById('storyData');
        const timeline = document.getElementById('storyline');
        const progress = timeline.querySelector('.timeline-progress');
        let events = [];
        try {
            events = JSON.parse(dataEl.textContent).events || [];
        } catch (e) {
            console.error('故事数据解析失败', e);
        }

        // "2026-09-12" -> "2026.09.12"；区间同年同月简写为 "2026.10.04 - 10.11"
        function fmtDate(iso) {
            const [y, m, d] = iso.split('-');
            return { full: `${y}.${m}.${d}`, short: `${m}.${d}` };
        }
        function fmtLabel(ev) {
            if (ev.label) return { text: ev.label, datetime: ev.date || ev.start };
            if (ev.date) {
                return { text: fmtDate(ev.date).full, datetime: ev.date };
            }
            const s = fmtDate(ev.start), e = fmtDate(ev.end);
            const [sy, sm] = ev.start.split('-');
            const [ey, em] = ev.end.split('-');
            const text = (sy === ey && sm === em)
                ? `${s.full} - ${e.short}`
                : (sy === ey ? `${s.full} - ${e.short}` : `${s.full} - ${e.full}`);
            return { text, datetime: ev.start };
        }

        events.forEach(ev => {
            const { text, datetime } = fmtLabel(ev);
            const article = document.createElement('article');
            article.className = 'story-event' + (ev.highlight ? ' highlight' : '');
            article.innerHTML =
                '<span class="event-pin" aria-hidden="true"></span>' +
                '<div class="event-copy">' +
                    `<div class="event-meta"><time datetime="${datetime}">${text}</time></div>` +
                '</div>';
            // progress 是第一个子元素，直接追加即可保持数据顺序
            timeline.appendChild(article);
        });
    })();
    </script>

    <script>
    (function () {
        const timeline = document.querySelector('.storyline');
        const progress = document.querySelector('.timeline-progress');
        const events = [...document.querySelectorAll('.story-event')];
        const position = document.getElementById('storyPosition');

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
            events.forEach(event => observer.observe(event));
        } else {
            events.forEach(event => event.classList.add('is-visible'));
        }

        let scheduled = false;
        function updateTimeline() {
            const rect = timeline.getBoundingClientRect();
            const lineLength = timeline.clientHeight - (window.innerWidth <= 700 ? 50 : 90);
            const atEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
            const revealPoint = atEnd ? window.innerHeight : window.innerHeight * 0.52;
            progress.style.height = Math.max(0, Math.min(lineLength, revealPoint - rect.top)) + 'px';

            let current = -1;
            events.forEach((event, index) => {
                if (event.querySelector('.event-pin').getBoundingClientRect().top <= revealPoint) {
                    current = index;
                }
                event.classList.toggle('is-current', index === current);
            });
            position.textContent = String(Math.max(1, current + 1)).padStart(2, '0') + ' / ' +
                String(events.length).padStart(2, '0');
            scheduled = false;
        }
        function scheduleUpdate() {
            if (!scheduled) {
                scheduled = true;
                requestAnimationFrame(updateTimeline);
            }
        }
        window.addEventListener('scroll', scheduleUpdate, { passive: true });
        window.addEventListener('resize', scheduleUpdate);
        updateTimeline();
    })();
    </script>

    <script>
    (function () {
        const canvas = document.getElementById('fallingHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        const palette = ['#677d8a', '#91a2ac', '#b3c0c8', '#758b99', '#a1b2bc'];
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const PARTICLE_COUNT = isMobile ? 22 : 50;
        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 2,
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function drawHeart(x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.5);
            ctx.bezierCurveTo(x - s, y + s, x, y + s * 1.3, x, y + s * 1.5);
            ctx.bezierCurveTo(x, y + s * 1.3, x + s, y + s, x + s, y + s * 0.5);
            ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
            ctx.fill();
            ctx.lineWidth = 0.6;
            ctx.strokeStyle = 'rgba(51, 68, 79, 0.45)';
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = window.innerWidth;
                if (p.x > window.innerWidth) p.x = 0;
                if (p.y > window.innerHeight) {
                    p.y = -10;
                    p.x = Math.random() * window.innerWidth;
                }
                drawHeart(p.x, p.y, p.r, p.color, p.alpha);
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

    <script>
    (function () {
        const canvas = document.getElementById('clickHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        function heartShape(s) {
            ctx.beginPath();
            ctx.moveTo(0, s * 0.3);
            ctx.bezierCurveTo(0, -s * 0.2, -s * 0.6, -s * 0.2, -s * 0.5, s * 0.2);
            ctx.bezierCurveTo(-s * 0.4, s * 0.6, 0, s * 0.8, 0, s);
            ctx.bezierCurveTo(0, s * 0.8, s * 0.4, s * 0.6, s * 0.5, s * 0.2);
            ctx.bezierCurveTo(s * 0.6, -s * 0.2, 0, -s * 0.2, 0, s * 0.3);
            ctx.closePath();
        }

        const palette = ['#8fa3af', '#b7c5cd', '#728996', '#a6b8c2', '#7c919e'];
        function Particle(x, y) {
            this.x = x; this.y = y;
            this.size = 12 + Math.random() * 12;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -(2 + Math.random() * 2.5);
            this.life = 1;
            this.decay = 0.01 + Math.random() * 0.012;
            this.angle = (Math.random() - 0.5) * 0.6;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.color = palette[Math.floor(Math.random() * palette.length)];
        }
        Particle.prototype.update = function () {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; this.vx *= 0.99;
            this.angle += this.spin; this.life -= this.decay;
        };
        Particle.prototype.draw = function () {
            ctx.save();
            ctx.globalAlpha = Math.max(this.life, 0);
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            const shine = ctx.createLinearGradient(-this.size * 0.6, 0, this.size * 0.6, this.size);
            shine.addColorStop(0, '#f8fcfd');
            shine.addColorStop(0.28, this.color);
            shine.addColorStop(0.55, '#e5edf1');
            shine.addColorStop(1, '#526773');
            ctx.fillStyle = shine;
            heartShape(this.size);
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(46, 65, 76, 0.7)';
            ctx.stroke();
            ctx.restore();
        };

        function spawn(x, y) {
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const r = Math.random() * 8;
                const p = new Particle(x + Math.cos(a) * r, y + Math.sin(a) * r);
                p.vx = Math.cos(a) * (1.2 + Math.random() * 1.5);
                p.vy = Math.sin(a) * (1.2 + Math.random() * 1.5) - 1.5;
                particles.push(p);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        let lastTouchTime = 0;
        window.addEventListener('click', event => {
            if (Date.now() - lastTouchTime < 600) return;
            spawn(event.clientX, event.clientY);
        });
        window.addEventListener('touchstart', event => {
            lastTouchTime = Date.now();
            const touch = event.touches[0];
            spawn(touch.clientX, touch.clientY);
        }, { passive: true });
    })();
    </script>
</body>
</html>
