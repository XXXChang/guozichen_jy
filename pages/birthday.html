<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6cfd1">
    <title>22 岁生日 | JY_GZC</title>
    <style>
        :root {
            --berry: #b83f59;
            --coral: #dc6e79;
            --mint: #498d80;
            --gold: #d6a64b;
            --cream: #fff7e9;
            --ink: #563941;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 248, 222, 0.92), transparent 28%),
                radial-gradient(circle at 82% 75%, rgba(185, 226, 215, 0.58), transparent 30%),
                linear-gradient(135deg, #ffdfe5 0%, #f4c8b9 48%, #d5ebe4 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(184, 63, 89, 0.13) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(73, 141, 128, 0.11) 1px, transparent 1.5px);
            background-position: 0 0, 18px 22px;
            background-size: 42px 42px, 54px 54px;
        }
        [hidden] { display: none !important; }
        button, a { font: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--mint);
            outline-offset: 4px;
        }
        #fallingHearts, #clickHearts {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #fallingHearts { z-index: 1; }
        #clickHearts { z-index: 9999; }
        .back-link {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 50;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(86, 57, 65, 0.2);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.58);
            color: var(--ink);
            font-size: 25px;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(102, 57, 69, 0.12);
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.9); }
        .birthday-stage {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            cursor: default;
        }
        .cake-dock {
            position: fixed;
            z-index: 30;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 310px;
            transform: translate(-50%, -50%);
            transition:
                top 0.9s cubic-bezier(.2,.8,.2,1),
                left 0.9s cubic-bezier(.2,.8,.2,1),
                width 0.9s cubic-bezier(.2,.8,.2,1),
                height 0.9s cubic-bezier(.2,.8,.2,1),
                transform 0.9s cubic-bezier(.2,.8,.2,1);
            pointer-events: none;
        }
        .cake-dock::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 14px 40px rgba(92, 51, 61, 0.18);
            opacity: 0;
            transition: opacity 0.45s ease 0.42s;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .cake-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 310px;
            filter: drop-shadow(0 24px 30px rgba(103, 52, 56, 0.24));
            transform-origin: top left;
            transition: transform 0.9s cubic-bezier(.2,.8,.2,1), filter 0.9s ease;
        }
        .plate {
            position: absolute;
            left: 4px;
            bottom: 8px;
            width: 312px;
            height: 38px;
            border: 2px solid rgba(73, 141, 128, 0.42);
            border-radius: 50%;
            background: linear-gradient(180deg, #ffffff 0%, #d8f0eb 48%, #9fcfc4 100%);
            box-shadow:
                inset 0 7px 10px rgba(255, 255, 255, 0.9),
                0 9px 16px rgba(78, 93, 89, 0.18);
        }
        .plate::before {
            content: "";
            position: absolute;
            inset: 7px 23px;
            border: 1px solid rgba(73, 141, 128, 0.28);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
        }
        .cake-layer {
            position: absolute;
            left: 50%;
            border: 2px solid rgba(112, 65, 59, 0.18);
            border-radius: 22px 22px 14px 14px;
            overflow: hidden;
            transform: translateX(-50%);
            box-shadow:
                inset 0 -13px 18px rgba(112, 65, 59, 0.14),
                inset 0 5px 9px rgba(255, 255, 255, 0.25),
                0 8px 12px rgba(94, 51, 58, 0.12);
        }
        .cake-layer::before {
            content: "";
            position: absolute;
            z-index: 3;
            top: -2px;
            left: 5px;
            right: 5px;
            height: 20px;
            border-radius: 17px 17px 45% 45%;
            background: linear-gradient(180deg, #fffdf7, var(--cream));
            box-shadow: 0 5px 0 rgba(255, 255, 255, 0.3);
        }
        .cake-layer::after {
            content: "";
            position: absolute;
            z-index: 2;
            top: 11px;
            left: 11px;
            right: 11px;
            height: 27px;
            background:
                radial-gradient(circle at 10px 0, var(--cream) 0 9px, transparent 10px)
                0 0 / 42px 27px repeat-x;
            opacity: 0.98;
        }
        .cake-layer.bottom {
            bottom: 34px;
            width: 260px;
            height: 78px;
            background: linear-gradient(180deg, #f49ba5 0%, #df6f7b 52%, #c95566 100%);
        }
        .cake-layer.middle {
            bottom: 104px;
            width: 218px;
            height: 66px;
            background: linear-gradient(180deg, #91cabf 0%, #5aa091 54%, #3f7d72 100%);
        }
        .cake-layer.top {
            bottom: 162px;
            width: 174px;
            height: 58px;
            background: linear-gradient(180deg, #f7d783 0%, #dda94b 56%, #c48c2f 100%);
        }
        .cake-piping {
            position: absolute;
            z-index: 4;
            left: 14px;
            right: 14px;
            bottom: 8px;
            height: 9px;
            background:
                radial-gradient(circle, rgba(255, 255, 255, 0.82) 0 3px, transparent 4px)
                0 0 / 22px 9px repeat-x;
        }
        .cake-sprinkles {
            position: absolute;
            z-index: 4;
            top: 40px;
            left: 30px;
            width: 5px;
            height: 12px;
            border-radius: 5px;
            background: #fff2a6;
            rotate: 24deg;
            box-shadow:
                28px 7px 0 #f9d7e5,
                56px -3px 0 #bce8dd,
                84px 8px 0 #fff1ab,
                112px -2px 0 #f7c8d8,
                142px 6px 0 #c5e9df,
                172px -1px 0 #fff0a4;
        }
        .cake-layer.middle .cake-sprinkles {
            top: 36px;
            left: 25px;
            box-shadow:
                27px 6px 0 #fff0a4,
                54px -2px 0 #f7c8d8,
                82px 7px 0 #d5f0e9,
                110px -3px 0 #ffe59b,
                139px 5px 0 #f6c6d7;
        }
        .cake-layer.top .cake-sprinkles {
            top: 32px;
            left: 23px;
            box-shadow:
                27px 5px 0 #f7c8d8,
                55px -3px 0 #d5f0e9,
                84px 6px 0 #fff0a4,
                112px -2px 0 #f4bfd3;
        }
        .cake-garnish {
            position: absolute;
            z-index: 6;
            left: 82px;
            bottom: 209px;
            display: flex;
            justify-content: space-between;
            width: 156px;
            pointer-events: none;
        }
        .cake-garnish i {
            display: block;
            width: 17px;
            height: 13px;
            border: 2px solid rgba(112, 65, 59, 0.1);
            border-radius: 50% 50% 44% 44%;
            background: linear-gradient(180deg, #fff, #f9e5d7);
            box-shadow: 0 4px 0 rgba(214, 166, 75, 0.23);
        }
        .cake-garnish i:first-child,
        .cake-garnish i:last-child {
            background: linear-gradient(180deg, #f48a9b, #c84f65);
            box-shadow: 0 4px 0 rgba(142, 51, 70, 0.2);
        }
        .number-candle {
            position: absolute;
            z-index: 5;
            bottom: 210px;
            width: 48px;
            height: 62px;
            color: var(--berry);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            -webkit-text-stroke: 2px var(--cream);
            paint-order: stroke fill;
            text-shadow: 0 5px 0 rgba(214, 166, 75, 0.35), 0 8px 12px rgba(86, 57, 65, 0.18);
        }
        .number-candle.first { left: 105px; }
        .number-candle.second { right: 105px; }
        .flame {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 7px);
            width: 18px;
            height: 25px;
            border-radius: 70% 35% 65% 35%;
            background: radial-gradient(circle at 55% 65%, #fff7b2 0 18%, #ffc84d 30%, #f17842 74%);
            filter: drop-shadow(0 0 9px rgba(255, 166, 60, 0.85));
            transform: translateX(-50%) rotate(45deg);
            transform-origin: center bottom;
            animation: flameFlicker 0.42s ease-in-out infinite alternate;
            transition: opacity 0.35s ease, scale 0.35s ease;
        }
        @keyframes flameFlicker {
            from { scale: 0.94 1.04; rotate: -2deg; }
            to { scale: 1.08 0.92; rotate: 4deg; }
        }
        .smoke {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(101, 111, 111, 0.42);
            opacity: 0;
            transform: translateX(-50%);
        }
        body.candles-out .flame { opacity: 0; scale: 0.2; animation: none; }
        body.candles-out .smoke { animation: smokeRise 1.55s ease-out forwards; }
        body.candles-out .number-candle.second .smoke { animation-delay: 0.12s; }
        @keyframes smokeRise {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
            25% { opacity: 0.55; }
            100% { opacity: 0; transform: translate(-25%, -62px) scale(2.3); }
        }
        body.celebration-ready .cake-dock {
            top: 18px;
            left: 100%;
            width: 102px;
            height: 102px;
            transform: translateX(calc(-100% - 18px));
        }
        body.celebration-ready .cake-dock::before { opacity: 1; }
        body.celebration-ready .cake-scene {
            animation: none;
            transform: translate(5px, 7px) scale(0.29);
            filter: drop-shadow(0 10px 12px rgba(103, 52, 56, 0.2));
        }
        .celebration-panel {
            position: relative;
            z-index: 5;
            display: grid;
            align-content: center;
            justify-items: center;
            width: 100%;
            height: 100%;
            padding: 82px 24px 34px;
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.7s ease 0.28s, transform 0.8s cubic-bezier(.2,.8,.2,1) 0.28s;
        }
        body.celebration-ready .celebration-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .celebration-panel::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: 50%;
            left: 50%;
            width: min(76vw, 650px);
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.2);
        }
        .celebration-panel::after {
            content: "";
            position: absolute;
            z-index: -2;
            top: 50%;
            left: 50%;
            width: min(88vw, 760px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 2%, var(--gold) 0 3px, transparent 4px),
                radial-gradient(circle at 88% 22%, var(--mint) 0 3px, transparent 4px),
                radial-gradient(circle at 98% 58%, var(--coral) 0 3px, transparent 4px),
                radial-gradient(circle at 72% 92%, var(--gold) 0 3px, transparent 4px),
                radial-gradient(circle at 23% 91%, var(--mint) 0 3px, transparent 4px),
                radial-gradient(circle at 2% 57%, var(--berry) 0 3px, transparent 4px),
                radial-gradient(circle at 12% 20%, var(--coral) 0 3px, transparent 4px);
            transform: translate(-50%, -50%);
            opacity: 0.72;
            pointer-events: none;
        }
        .celebration-kicker {
            margin: 0 0 12px;
            color: var(--mint);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
        }
        .age-lockup {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: var(--berry);
            line-height: 0.8;
            text-shadow: 0 12px 30px rgba(184, 63, 89, 0.18);
        }
        .age-lockup::before,
        .age-lockup::after {
            content: "";
            position: absolute;
            top: 18%;
            width: 26px;
            height: 26px;
            background:
                linear-gradient(var(--gold), var(--gold)) 50% 0 / 2px 100% no-repeat,
                linear-gradient(90deg, var(--gold), var(--gold)) 0 50% / 100% 2px no-repeat;
            opacity: 0.8;
        }
        .age-lockup::before { left: -48px; rotate: 12deg; }
        .age-lockup::after { right: -48px; rotate: -12deg; }
        .age-number {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(92px, 18vw, 164px);
            font-weight: 600;
        }
        .birthday-date {
            margin: 20px 0 28px;
            padding: 8px 18px;
            border-top: 1px solid rgba(86, 57, 65, 0.3);
            border-bottom: 1px solid rgba(86, 57, 65, 0.3);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .birthday-flourish {
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(74vw, 330px);
            margin: 0 0 28px;
        }
        .birthday-flourish::before,
        .birthday-flourish::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(86, 57, 65, 0.42));
        }
        .birthday-flourish::after {
            background: linear-gradient(90deg, rgba(86, 57, 65, 0.42), transparent);
        }
        .birthday-flourish i {
            width: 8px;
            height: 8px;
            border: 1px solid var(--berry);
            background: rgba(255, 255, 255, 0.72);
            transform: rotate(45deg);
        }
        .letter-trigger {
            position: relative;
            display: grid;
            place-items: center;
            width: 180px;
            height: 138px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: transform 0.28s ease, filter 0.28s ease;
            animation: letterFloat 4.2s ease-in-out infinite;
        }
        .letter-trigger::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 5px;
            width: 132px;
            height: 25px;
            border-radius: 50%;
            background: rgba(86, 57, 65, 0.14);
            filter: blur(9px);
            transform: translateX(-50%);
        }
        .letter-trigger:hover {
            transform: translateY(-7px) rotate(1deg) scale(1.04);
            filter: brightness(1.03);
        }
        @keyframes letterFloat {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -8px; }
        }
        .letter-envelope {
            position: relative;
            display: block;
            width: 142px;
            height: 98px;
            overflow: hidden;
            border: 3px solid var(--berry);
            border-radius: 9px;
            background: linear-gradient(145deg, #fffdf5, #f8d2df);
            box-shadow:
                9px 11px 0 rgba(214, 166, 75, 0.24),
                0 18px 30px rgba(103, 52, 66, 0.22);
            transform: rotate(-4deg);
        }
        .letter-envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(0 0, 50% 56%, 100% 0);
            background: #fffdf8;
        }
        .letter-envelope::after {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(0 100%, 0 28%, 50% 70%, 100% 28%, 100% 100%);
            background: #f4c6d5;
        }
        .letter-seal {
            position: absolute;
            z-index: 3;
            left: 50%;
            top: 54%;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border: 3px solid #fff0b5;
            border-radius: 50%;
            background: var(--berry);
            color: white;
            font-size: 22px;
            line-height: 1;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 0 rgba(102, 45, 68, 0.22);
        }
        .balloon-cluster {
            position: fixed;
            z-index: 3;
            top: 11%;
            width: 92px;
            height: 180px;
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s ease 0.5s, transform 0.8s ease 0.5s;
            pointer-events: none;
        }
        body.celebration-ready .balloon-cluster { opacity: 0.9; transform: translateY(0); }
        .balloon-cluster.left { left: 6%; }
        .balloon-cluster.right { right: 7%; transform: translateY(25px) scaleX(-1); }
        body.celebration-ready .balloon-cluster.right { transform: translateY(0) scaleX(-1); }
        .balloon {
            position: absolute;
            width: 48px;
            height: 60px;
            border: 1px solid rgba(86, 57, 65, 0.13);
            border-radius: 52% 48% 48% 52%;
            box-shadow: inset -8px -8px 12px rgba(86, 57, 65, 0.1);
        }
        .balloon::after {
            content: "";
            position: absolute;
            top: 58px;
            left: 50%;
            width: 1px;
            height: 94px;
            background: rgba(86, 57, 65, 0.34);
            transform: rotate(5deg);
            transform-origin: top;
        }
        .balloon.one { top: 0; left: 4px; background: #e97d89; }
        .balloon.two { top: 34px; left: 42px; background: #73afa2; }
        .balloon.three { top: 74px; left: 0; width: 42px; height: 52px; background: #edc267; }
        .balloon.three::after { top: 50px; height: 54px; }
        .confetti {
            position: fixed;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease 0.35s;
        }
        body.celebration-ready .confetti { opacity: 0.9; }
        .confetti i {
            position: absolute;
            width: 9px;
            height: 18px;
            border-radius: 2px;
            background: var(--coral);
            rotate: 24deg;
            animation: confettiDrift 5s ease-in-out infinite;
        }
        .confetti i:nth-child(1) { top: 16%; left: 24%; }
        .confetti i:nth-child(2) { top: 24%; right: 26%; background: var(--mint); rotate: -34deg; animation-delay: -1s; }
        .confetti i:nth-child(3) { top: 68%; left: 18%; background: var(--gold); rotate: 56deg; animation-delay: -2.3s; }
        .confetti i:nth-child(4) { top: 73%; right: 18%; width: 15px; height: 8px; background: var(--berry); animation-delay: -3.1s; }
        .confetti i:nth-child(5) { top: 43%; left: 8%; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation-delay: -0.7s; }
        .confetti i:nth-child(6) { top: 38%; right: 8%; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation-delay: -1.8s; }
        @keyframes confettiDrift {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 12px; rotate: 90deg; }
        }
        .letter-dialog {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(45, 28, 50, 0.74);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .letter-paper {
            position: relative;
            display: block;
            width: min(92vw, 720px);
            max-height: min(88vh, 650px);
            padding: 16px;
            overflow: visible;
            border: 6px solid #9f67c8;
            border-radius: 34px;
            background: linear-gradient(145deg, #f3a8d2, #a06ad0 70%, #734cad);
            color: #4d403a;
            box-shadow:
                0 0 0 3px rgba(255, 225, 123, 0.88),
                0 32px 90px rgba(27, 12, 36, 0.48),
                inset 0 0 28px rgba(255, 255, 255, 0.38);
            animation: letterOpen 0.45s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes letterOpen {
            from { opacity: 0; transform: translateY(34px) scale(0.88) rotate(-1.5deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        .letter-paper::before {
            display: none;
        }
        .book-page {
            position: relative;
            min-height: 520px;
            padding: 86px 72px 62px;
            overflow: hidden;
            background:
                radial-gradient(circle at 88% 12%, rgba(244, 179, 213, 0.18), transparent 22%),
                radial-gradient(circle at 12% 88%, rgba(121, 202, 167, 0.14), transparent 24%),
                #fffdf9;
            border-radius: 18px;
            box-shadow: inset 0 0 34px rgba(127, 82, 126, 0.11);
        }
        .book-page-right { border-radius: 18px; }
        .book-page::after {
            content: "";
            position: absolute;
            inset: 12px;
            border: 2px solid rgba(164, 92, 196, 0.34);
            border-radius: 14px;
            pointer-events: none;
        }
        .book-bunting {
            position: absolute;
            z-index: 8;
            top: -9px;
            left: 50%;
            display: flex;
            gap: 9px;
            transform: translateX(-50%) rotate(-1deg);
        }
        .book-bunting i {
            display: block;
            width: 34px;
            height: 43px;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background: #f4cc49;
            filter: drop-shadow(0 3px 2px rgba(54, 28, 67, 0.22));
        }
        .book-bunting i:nth-child(2) { background: #ef78ac; }
        .book-bunting i:nth-child(3) { background: #71c8e8; }

        @media (prefers-reduced-motion: reduce) {
            .flame, .confetti i, .letter-paper, .letter-trigger {
                animation: none !important;

            .cake-dock, .celebration-panel, .cake-scene { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <canvas id="fallingHearts" aria-hidden="true"></canvas>
    <canvas id="clickHearts" aria-hidden="true"></canvas>
    <a class="back-link" href="../index.html" aria-label="返回主页">←</a>

    <div class="confetti" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>

    <div class="balloon-cluster right" aria-hidden="true">
        <i class="balloon one"></i>

    </div>

    <main id="birthdayStage" class="birthday-stage" aria-label="生日蛋糕，点击任意位置吹灭蜡烛">
        <div class="cake-dock" aria-hidden="true">
            <div class="cake-scene">
                <div class="plate"></div>
                <div class="cake-layer bottom"><span class="cake-piping"></span><span class="cake-sprinkles"></span></div>
                <div class="cake-layer middle"><span class="cake-piping"></span><span class="cake-sprinkles"></span></div>
                <div class="cake-layer top"><span class="cake-piping"></span><span class="cake-sprinkles"></span></div>
                <div class="cake-garnish"><i></i><i></i><i></i><i></i></div>
                <div class="number-candle first"><span>2</span><i class="flame"></i><i class="smoke"></i></div>
                <div class="number-candle second"><span>2</span><i class="flame"></i><i class="smoke"></i></div>
            </div>
        </div>

        <section id="celebrationPanel" class="celebration-panel" aria-label="22 岁生日主界面" aria-hidden="true" inert>
            <p class="celebration-kicker">HAPPY BIRTHDAY</p>
            <div class="age-lockup">
                <span class="age-number">22</span>
            </div>
            <p class="birthday-date">2005.01.05</p>
            <div class="birthday-flourish" aria-hidden="true"><i></i></div>

        </section>
        <span id="birthdayStatus" class="sr-only" aria-live="polite">蜡烛已经点亮</span>
    </main>

    <div id="letterDialog" class="letter-dialog" role="dialog" aria-modal="true" aria-labelledby="letterTitle" hidden>
        <article class="letter-paper">
            <div class="book-bunting" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <span class="book-badge" aria-hidden="true">22</span>
            <span class="book-ribbon" aria-hidden="true"></span>
            <span class="book-heart-tab" aria-hidden="true">♥</span>

            <section class="book-page book-page-right">
                <span class="paper-corners" aria-hidden="true">
                    <i class="top-left"></i><i class="top-right"></i>
                    <i class="bottom-left"></i><i class="bottom-right"></i>
                </span>
                <h2 id="letterTitle" class="letter-title">给姐姐的一封信</h2>
                <p class="letter-body">这是一封信，这是一封信，这是一封信……

这是一封信，这是一封信，这是一封信，这是一封信……

这是一封信，这是一封信，这是一封信……</p>
            </section>
        </article>
    </div>

    <script>
    (function () {
        const canvas = document.getElementById('fallingHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        const palette = ['#b83f59', '#dc6e79', '#498d80', '#7ab6a8', '#d6a64b'];
        const count = reduced ? 12 : (window.innerWidth <= 768 ? 28 : 56);
        const hearts = Array.from({ length: count }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: 2 + Math.random() * 3.8,
            vx: (Math.random() - 0.5) * 0.45,
            vy: 0.35 + Math.random() * 0.7,
            alpha: 0.26 + Math.random() * 0.5,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function heartPath(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y + size * 0.3);
            ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.5);
            ctx.bezierCurveTo(x - size, y + size, x, y + size * 1.3, x, y + size * 1.5);
            ctx.bezierCurveTo(x, y + size * 1.3, x + size, y + size, x + size, y + size * 0.5);
            ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
            ctx.closePath();
        }

        function draw() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            hearts.forEach(heart => {
                heart.x += heart.vx;
                heart.y += heart.vy;
                if (heart.x < 0) heart.x = window.innerWidth;
                if (heart.x > window.innerWidth) heart.x = 0;
                if (heart.y > window.innerHeight) {
                    heart.y = -12;
                    heart.x = Math.random() * window.innerWidth;
                }
                ctx.save();
                ctx.globalAlpha = heart.alpha;
                ctx.fillStyle = heart.color;
                heartPath(heart.x, heart.y, heart.size);
                ctx.fill();
                ctx.restore();
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

    <script>
    (function () {
        const canvas = document.getElementById('clickHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const palette = ['#b83f59', '#dc6e79', '#498d80', '#7ab6a8', '#d6a64b'];
        const stage = document.getElementById('birthdayStage');
        const panel = document.getElementById('celebrationPanel');
        const status = document.getElementById('birthdayStatus');
        const letterTrigger = document.getElementById('letterTrigger');
        const letterDialog = document.getElementById('letterDialog');
        const letterClose = document.getElementById('letterClose');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let particles = [];
        let extinguished = false;
        let lastTouch = 0;
        let lastFocused = null;

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function heartShape(size) {
            ctx.beginPath();
            ctx.moveTo(0, size * 0.3);
            ctx.bezierCurveTo(0, -size * 0.2, -size * 0.6, -size * 0.2, -size * 0.5, size * 0.2);
            ctx.bezierCurveTo(-size * 0.4, size * 0.6, 0, size * 0.8, 0, size);
            ctx.bezierCurveTo(0, size * 0.8, size * 0.4, size * 0.6, size * 0.5, size * 0.2);
            ctx.bezierCurveTo(size * 0.6, -size * 0.2, 0, -size * 0.2, 0, size * 0.3);
            ctx.closePath();
        }

        function spawn(x, y, amount = 5) {
            for (let index = 0; index < amount; index++) {
                const angle = Math.PI * 2 * index / amount + Math.random() * 0.45;
                particles.push({
                    x,
                    y,
                    size: 13 + Math.random() * 13,
                    vx: Math.cos(angle) * (1.3 + Math.random() * 1.8),
                    vy: Math.sin(angle) * (1.3 + Math.random() * 1.8) - 1.7,
                    life: 1,
                    decay: 0.012 + Math.random() * 0.012,
                    angle: (Math.random() - 0.5) * 0.5,
                    spin: (Math.random() - 0.5) * 0.05,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(particle => particle.life > 0);
            particles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.05;
                particle.vx *= 0.99;
                particle.angle += particle.spin;
                particle.life -= particle.decay;
                ctx.save();
                ctx.globalAlpha = Math.max(0, particle.life);
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.angle);
                ctx.fillStyle = particle.color;
                heartShape(particle.size);
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = 'rgba(108, 54, 62, 0.48)';
                ctx.stroke();
                ctx.restore();
            });
            requestAnimationFrame(animate);
        }
        animate();

        function isProtectedTarget(target) {
            return target instanceof Element && Boolean(target.closest('.back-link, .letter-trigger, .letter-dialog'));
        }

        function revealCelebration() {
            document.body.classList.add('celebration-ready');
            panel.inert = false;
            panel.setAttribute('aria-hidden', 'false');
            status.textContent = '生日主界面已经打开';
        }

        function handleInteraction(x, y, target) {
            if (isProtectedTarget(target)) return;
            if (extinguished) {
                spawn(x, y, 6);
                return;
            }

            spawn(x, y, 13);
            extinguished = true;
            document.body.classList.add('candles-out');
            status.textContent = '蜡烛已经熄灭';
            window.setTimeout(revealCelebration, reduced ? 80 : 1150);
        }

        function openLetter(event) {
            event.stopPropagation();
            lastFocused = document.activeElement;
            letterDialog.hidden = false;
            stage.inert = true;
            letterClose.focus();
        }

        function closeLetter() {
            if (letterDialog.hidden) return;
            letterDialog.hidden = true;
            stage.inert = false;
            lastFocused?.focus();
        }

        window.addEventListener('click', event => {
            if (Date.now() - lastTouch < 600) return;
            handleInteraction(event.clientX, event.clientY, event.target);
        });
        window.addEventListener('touchstart', event => {
            lastTouch = Date.now();
            const touch = event.touches[0];
            handleInteraction(touch.clientX, touch.clientY, event.target);
        }, { passive: true });

        letterTrigger.addEventListener('click', openLetter);
        letterClose.addEventListener('click', event => {
            event.stopPropagation();
            closeLetter();
        });
        letterDialog.addEventListener('click', event => {
            if (event.target === letterDialog) closeLetter();
        });
        window.addEventListener('keydown', event => {
            if (!letterDialog.hidden && event.key === 'Escape') closeLetter();
        });
    })();
    </script>
