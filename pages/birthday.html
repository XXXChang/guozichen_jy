<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6cfd1">
    <title>22 岁生日 | JY_GZC</title>
    <style>
        :root {
            --berry: #b83f59;
            --coral: #dc6e79;
            --mint: #498d80;
            --gold: #d6a64b;
            --cream: #fff7e9;
            --ink: #563941;
        }
        * { box-sizing: border-box; }
        html { width: 100%; height: 100%; overflow: hidden; background: #f4c8b9; }
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            isolation: isolate;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 248, 222, 0.92), transparent 28%),
                radial-gradient(circle at 82% 75%, rgba(185, 226, 215, 0.58), transparent 30%),
                linear-gradient(135deg, #ffdfe5 0%, #f4c8b9 48%, #d5ebe4 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(184, 63, 89, 0.13) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(73, 141, 128, 0.11) 1px, transparent 1.5px);
            background-position: 0 0, 18px 22px;
            background-size: 42px 42px, 54px 54px;
        }
        [hidden] { display: none !important; }
        button, a { font: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--mint);
            outline-offset: 4px;
        }
        #fallingHearts, #clickHearts {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #fallingHearts { z-index: 1; }
        #clickHearts { z-index: 9999; }
        .back-link {
            position: fixed;
            top: calc(22px + env(safe-area-inset-top, 0px));
            left: calc(24px + env(safe-area-inset-left, 0px));
            z-index: 50;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(86, 57, 65, 0.2);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.58);
            color: var(--ink);
            font-size: 25px;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(102, 57, 69, 0.12);
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.9); }
        .birthday-stage {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            cursor: default;
        }
        .cake-dock {
            position: fixed;
            z-index: 30;
            top: 50%;
            left: 50%;
            width: min(440px, 92vw, calc((100vh - 72px) * .8163));
            width: min(440px, 92vw, calc((100dvh - 72px) * .8163));
            aspect-ratio: 320 / 392;
            transform: translate(-50%, -50%);
            transition:
                top 0.9s cubic-bezier(.2,.8,.2,1),
                left 0.9s cubic-bezier(.2,.8,.2,1),
                width 0.9s cubic-bezier(.2,.8,.2,1),
                transform 0.9s cubic-bezier(.2,.8,.2,1),
                opacity 0.45s ease 0.35s,
                visibility 0s linear 0.9s;
            pointer-events: none;
        }
        .cake-scene {
            position: relative;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 24px rgba(103, 52, 56, 0.18));
            transition: filter 0.9s ease;
        }
        .cake-dock::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 8% -12% 0;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255, 250, 225, .85), rgba(255, 231, 203, .28) 45%, transparent 70%);
            filter: blur(16px);
            opacity: .9;
            transition: opacity .5s ease;
        }
        .birthday-cake-art {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .candle-halo {
            opacity: .85;
            transition: opacity .35s ease;
        }
        .flame {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: flameFlicker .48s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 5px rgba(255, 173, 64, .7));
        }
        .number-candle.second .flame { animation-delay: -.23s; }
        @keyframes flameFlicker {
            from { transform: rotate(-5deg) scale(.93, 1.07); }
            to { transform: rotate(6deg) scale(1.06, .94); }
        }
        .smoke {
            fill: none;
            stroke: #8b7d79;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            opacity: 0;
            filter: blur(.5px);
        }
        .smoke-trail { stroke: #b9a49a; stroke-width: 3; }
        .wick-ember { opacity: 0; }
        body.candles-out .flame { animation: flameBlowOut .42s ease-out both; }
        body.candles-out .number-candle.second .flame { animation-delay: .09s; }
        body.candles-out .candle-halo { opacity: 0; }
        body.candles-out .cake-dock::after { opacity: .35; }
        body.candles-out .smoke { animation: smokeRise 1.8s ease-out .25s both; }
        body.candles-out .smoke-trail { animation-delay: .48s; }
        body.candles-out .number-candle.second .smoke { animation-delay: .38s; }
        body.candles-out .number-candle.second .smoke-trail { animation-delay: .6s; }
        body.candles-out .wick-ember { animation: emberFade 1.5s ease-out .2s both; }
        @keyframes flameBlowOut {
            0% { opacity: 1; transform: rotate(0) scale(1); }
            45% { opacity: .85; transform: translate(9px, -1px) rotate(48deg) scale(1.35, .5); }
            100% { opacity: 0; transform: translate(17px, 0) rotate(70deg) scale(.12, .04); }
        }
        @keyframes smokeRise {
            0% { opacity: 0; transform: translate(0, 3px) scale(.7); stroke-dashoffset: 120; }
            18% { opacity: .8; }
            65% { opacity: .5; }
            100% { opacity: 0; transform: translate(15px, -48px) scale(1.25); stroke-dashoffset: 0; }
        }
        @keyframes emberFade {
            0%, 30% { opacity: 1; }
            100% { opacity: 0; }
        }
        body.celebration-ready .cake-dock {
            top: calc(18px + env(safe-area-inset-top, 0px));
            left: 100%;
            width: 102px;
            transform: translateX(calc(-100% - 18px - env(safe-area-inset-right, 0px)));
            opacity: 0;
            visibility: hidden;
        }
        body.celebration-ready .cake-dock::after { opacity: 0; }
        body.celebration-ready .cake-scene {
            filter: drop-shadow(0 10px 12px rgba(103, 52, 56, 0.2));
        }
        .celebration-panel {
            position: relative;
            z-index: 5;
            display: grid;
            align-content: center;
            justify-items: center;
            width: 100%;
            height: 100%;
            padding: calc(82px + env(safe-area-inset-top, 0px)) 24px calc(34px + env(safe-area-inset-bottom, 0px));
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.7s ease 0.28s, transform 0.8s cubic-bezier(.2,.8,.2,1) 0.28s;
        }
        body.celebration-ready .celebration-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .celebration-panel::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: 50%;
            left: 50%;
            width: min(76vw, 650px);
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.2);
        }
        .celebration-panel::after {
            content: "";
            position: absolute;
            z-index: -2;
            top: 50%;
            left: 50%;
            width: min(88vw, 760px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 2%, var(--gold) 0 3px, transparent 4px),
                radial-gradient(circle at 88% 22%, var(--mint) 0 3px, transparent 4px),
                radial-gradient(circle at 98% 58%, var(--coral) 0 3px, transparent 4px),
                radial-gradient(circle at 72% 92%, var(--gold) 0 3px, transparent 4px),
                radial-gradient(circle at 23% 91%, var(--mint) 0 3px, transparent 4px),
                radial-gradient(circle at 2% 57%, var(--berry) 0 3px, transparent 4px),
                radial-gradient(circle at 12% 20%, var(--coral) 0 3px, transparent 4px);
            transform: translate(-50%, -50%);
            opacity: 0.72;
            pointer-events: none;
        }
        .celebration-kicker {
            margin: 0 0 12px;
            color: var(--mint);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
        }
        .age-lockup {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: var(--berry);
            line-height: 0.8;
            text-shadow: 0 12px 30px rgba(184, 63, 89, 0.18);
        }
        .age-lockup::before,
        .age-lockup::after {
            content: "";
            position: absolute;
            top: 18%;
            width: 26px;
            height: 26px;
            background:
                linear-gradient(var(--gold), var(--gold)) 50% 0 / 2px 100% no-repeat,
                linear-gradient(90deg, var(--gold), var(--gold)) 0 50% / 100% 2px no-repeat;
            opacity: 0.8;
        }
        .age-lockup::before { left: -48px; rotate: 12deg; }
        .age-lockup::after { right: -48px; rotate: -12deg; }
        .age-number {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(92px, 18vw, 164px);
            font-weight: 600;
        }
        .birthday-date {
            margin: 20px 0 28px;
            padding: 8px 18px;
            border-top: 1px solid rgba(86, 57, 65, 0.3);
            border-bottom: 1px solid rgba(86, 57, 65, 0.3);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .birthday-flourish {
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(74vw, 330px);
            margin: 0 0 28px;
        }
        .birthday-flourish::before,
        .birthday-flourish::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(86, 57, 65, 0.42));
        }
        .birthday-flourish::after {
            background: linear-gradient(90deg, rgba(86, 57, 65, 0.42), transparent);
        }
        .birthday-flourish i {
            width: 8px;
            height: 8px;
            border: 1px solid var(--berry);
            background: rgba(255, 255, 255, 0.72);
            transform: rotate(45deg);
        }
        .letter-trigger {
            position: relative;
            display: grid;
            place-items: center;
            width: 180px;
            height: 138px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: transform 0.28s ease, filter 0.28s ease;
            animation: letterFloat 4.2s ease-in-out infinite;
        }
        .letter-trigger::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 5px;
            width: 132px;
            height: 25px;
            border-radius: 50%;
            background: rgba(86, 57, 65, 0.14);
            filter: blur(9px);
            transform: translateX(-50%);
        }
        .letter-trigger:hover {
            transform: translateY(-7px) rotate(1deg) scale(1.04);
            filter: brightness(1.03);
        }
        @keyframes letterFloat {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -8px; }
        }
        .letter-envelope {
            position: relative;
            display: block;
            width: 142px;
            height: 98px;
            overflow: hidden;
            border: 3px solid var(--berry);
            border-radius: 9px;
            background: linear-gradient(145deg, #fffdf5, #f8d2df);
            box-shadow:
                9px 11px 0 rgba(214, 166, 75, 0.24),
                0 18px 30px rgba(103, 52, 66, 0.22);
            transform: rotate(-4deg);
        }
        .letter-envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(0 0, 50% 56%, 100% 0);
            background: #fffdf8;
        }
        .letter-envelope::after {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(0 100%, 0 28%, 50% 70%, 100% 28%, 100% 100%);
            background: #f4c6d5;
        }
        .letter-seal {
            position: absolute;
            z-index: 3;
            left: 50%;
            top: 54%;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border: 3px solid #fff0b5;
            border-radius: 50%;
            background: var(--berry);
            color: white;
            font-size: 22px;
            line-height: 1;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 0 rgba(102, 45, 68, 0.22);
        }
        .balloon-cluster {
            position: fixed;
            z-index: 3;
            top: 11%;
            width: 92px;
            height: 180px;
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s ease 0.5s, transform 0.8s ease 0.5s;
            pointer-events: none;
        }
        body.celebration-ready .balloon-cluster { opacity: 0.9; transform: translateY(0); }
        .balloon-cluster.left { left: 6%; }
        .balloon-cluster.right { right: 7%; transform: translateY(25px) scaleX(-1); }
        body.celebration-ready .balloon-cluster.right { transform: translateY(0) scaleX(-1); }
        .balloon {
            position: absolute;
            width: 48px;
            height: 60px;
            border: 1px solid rgba(86, 57, 65, 0.13);
            border-radius: 52% 48% 48% 52%;
            box-shadow: inset -8px -8px 12px rgba(86, 57, 65, 0.1);
        }
        .balloon::after {
            content: "";
            position: absolute;
            top: 58px;
            left: 50%;
            width: 1px;
            height: 94px;
            background: rgba(86, 57, 65, 0.34);
            transform: rotate(5deg);
            transform-origin: top;
        }
        .balloon.one { top: 0; left: 4px; background: #e97d89; }
        .balloon.two { top: 34px; left: 42px; background: #73afa2; }
        .balloon.three { top: 74px; left: 0; width: 42px; height: 52px; background: #edc267; }
        .balloon.three::after { top: 50px; height: 54px; }
        .confetti {
            position: fixed;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease 0.35s;
        }
        body.celebration-ready .confetti { opacity: 0.9; }
        .confetti i {
            position: absolute;
            width: 9px;
            height: 18px;
            border-radius: 2px;
            background: var(--coral);
            rotate: 24deg;
            animation: confettiDrift 5s ease-in-out infinite;
        }
        .confetti i:nth-child(1) { top: 16%; left: 24%; }
        .confetti i:nth-child(2) { top: 24%; right: 26%; background: var(--mint); rotate: -34deg; animation-delay: -1s; }
        .confetti i:nth-child(3) { top: 68%; left: 18%; background: var(--gold); rotate: 56deg; animation-delay: -2.3s; }
        .confetti i:nth-child(4) { top: 73%; right: 18%; width: 15px; height: 8px; background: var(--berry); animation-delay: -3.1s; }
        .confetti i:nth-child(5) { top: 43%; left: 8%; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation-delay: -0.7s; }
        .confetti i:nth-child(6) { top: 38%; right: 8%; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation-delay: -1.8s; }
        @keyframes confettiDrift {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 12px; rotate: 90deg; }
        }
        .letter-dialog {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(45, 28, 50, 0.74);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .letter-paper {
            position: relative;
            display: block;
            width: min(92vw, 720px);
            max-height: min(88vh, 650px);
            padding: 16px;
            overflow: visible;
            border: 6px solid #9f67c8;
            border-radius: 34px;
            background: linear-gradient(145deg, #f3a8d2, #a06ad0 70%, #734cad);
            color: #4d403a;
            box-shadow:
                0 0 0 3px rgba(255, 225, 123, 0.88),
                0 32px 90px rgba(27, 12, 36, 0.48),
                inset 0 0 28px rgba(255, 255, 255, 0.38);
            animation: letterOpen 0.45s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes letterOpen {
            from { opacity: 0; transform: translateY(34px) scale(0.88) rotate(-1.5deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        .letter-paper::before {
            display: none;
        }
        .book-page {
            position: relative;
            min-height: 520px;
            padding: 86px 72px 62px;
            overflow: hidden;
            background:
                radial-gradient(circle at 88% 12%, rgba(244, 179, 213, 0.18), transparent 22%),
                radial-gradient(circle at 12% 88%, rgba(121, 202, 167, 0.14), transparent 24%),
                #fffdf9;
            border-radius: 18px;
            box-shadow: inset 0 0 34px rgba(127, 82, 126, 0.11);
        }
        .book-page-right { border-radius: 18px; }
        .book-page::after {
            content: "";
            position: absolute;
            inset: 12px;
            border: 2px solid rgba(164, 92, 196, 0.34);
            border-radius: 14px;
            pointer-events: none;
        }
        .book-bunting {
            position: absolute;
            z-index: 8;
            top: -9px;
            left: 50%;
            display: flex;
            gap: 9px;
            transform: translateX(-50%) rotate(-1deg);
        }
        .book-bunting i {
            display: block;
            width: 34px;
            height: 43px;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background: #f4cc49;
            filter: drop-shadow(0 3px 2px rgba(54, 28, 67, 0.22));
        }
        .book-bunting i:nth-child(2) { background: #ef78ac; }
        .book-bunting i:nth-child(3) { background: #71c8e8; }
        .book-bunting i:nth-child(4) { background: #8bcf92; }
        .book-bunting i:nth-child(5) { background: #a87be0; }
        .book-badge {
            position: absolute;
            z-index: 7;
            top: -24px;
            left: -22px;
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            border: 4px solid #fff5a6;
            border-radius: 26px 38px 24px 42px;
            background: linear-gradient(145deg, #ff83b5, #a865dc);
            color: white;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            font-weight: 800;
            rotate: -9deg;
            box-shadow: 0 8px 0 rgba(93, 52, 126, 0.24);
        }
        .book-ribbon {
            position: absolute;
            z-index: 7;
            left: -24px;
            bottom: -17px;
            width: 220px;
            height: 31px;
            border-radius: 6px 50% 50% 6px;
            background: linear-gradient(180deg, #fa8bbc, #dc5d9d);
            box-shadow: 0 8px 12px rgba(83, 38, 78, 0.28);
            transform: rotate(-4deg);
        }
        .book-ribbon::after {
            content: "";
            position: absolute;
            right: -34px;
            top: 0;
            border-top: 16px solid #e36aa5;
            border-bottom: 15px solid #e36aa5;
            border-right: 35px solid transparent;
        }
        .book-heart-tab {
            position: absolute;
            z-index: 7;
            right: -28px;
            top: 42%;
            display: grid;
            place-items: center;
            width: 52px;
            height: 68px;
            border: 3px solid #8e58bd;
            border-radius: 7px 13px 13px 7px;
            background: #f16ca9;
            color: white;
            font-size: 29px;
            box-shadow: 7px 7px 0 rgba(66, 38, 86, 0.22);
        }
        .paper-corners i {
            position: absolute;
            z-index: 4;
            width: 18px;
            height: 18px;
            border: 2px solid #c978aa;
            background: #fff6c9;
            transform: rotate(45deg);
        }
        .paper-corners .top-left { top: 27px; left: 27px; }
        .paper-corners .top-right { top: 27px; right: 27px; border-color: #78bfa8; }
        .paper-corners .bottom-left { bottom: 27px; left: 27px; border-color: #78bfa8; }
        .paper-corners .bottom-right { right: 27px; bottom: 27px; }
        .letter-close {
            position: absolute;
            z-index: 20;
            top: -22px;
            right: -22px;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 3px solid #fff4a5;
            border-radius: 15px 22px 13px 21px;
            background: #f5c742;
            color: #38213f;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            rotate: 8deg;
            box-shadow: 0 7px 0 rgba(91, 54, 108, 0.28);
        }
        .letter-title {
            position: relative;
            z-index: 3;
            margin: 0 0 34px;
            color: #9a4fc0;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 31px;
            font-weight: 700;
            text-align: center;
        }
        .letter-body {
            position: relative;
            z-index: 3;
            margin: 0;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 17px;
            line-height: 2;
            white-space: pre-wrap;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (max-width: 680px) {
            .back-link { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); width: 40px; height: 40px; }
            body.celebration-ready .cake-dock {

    <script>
    (function () {
        const canvas = document.getElementById('fallingHearts');
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        const palette = ['#b83f59', '#dc6e79', '#498d80', '#7ab6a8', '#d6a64b'];
        const count = reduced ? 12 : (window.innerWidth <= 768 ? 28 : 56);
        const hearts = Array.from({ length: count }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: 2 + Math.random() * 3.8,
            vx: (Math.random() - 0.5) * 0.45,
            vy: 0.35 + Math.random() * 0.7,
            alpha: 0.26 + Math.random() * 0.5,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function heartPath(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y + size * 0.3);
            ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.5);
            ctx.bezierCurveTo(x - size, y + size, x, y + size * 1.3, x, y + size * 1.5);
            ctx.bezierCurveTo(x, y + size * 1.3, x + size, y + size, x + size, y + size * 0.5);
            ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
            ctx.closePath();
        }

        function draw() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            hearts.forEach(heart => {
                heart.x += heart.vx;
                heart.y += heart.vy;
                if (heart.x < 0) heart.x = window.innerWidth;
                if (heart.x > window.innerWidth) heart.x = 0;
                if (heart.y > window.innerHeight) {
                    heart.y = -12;
                    heart.x = Math.random() * window.innerWidth;
                }
                ctx.save();
                ctx.globalAlpha = heart.alpha;
                ctx.fillStyle = heart.color;
                heartPath(heart.x, heart.y, heart.size);
                ctx.fill();
                ctx.restore();
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

        const giftReset = document.getElementById('giftReset');
        const giftTestCount = document.getElementById('giftTestCount');
        const giftConfig = window.BIRTHDAY_GIFTS || { version: '', prizes: [] };
        let giftStorage;
        try { giftStorage = window.localStorage; } catch { /* 无存储权限时在本次打开中保留进度。 */ }
        const giftGame = window.BirthdayGiftDraw.create(giftConfig, giftStorage);
        const prizes = giftGame.prizes;
        const giftCards = new Map();
        let giftState = giftGame.read();
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let particles = [];
        let extinguished = false;
        let lastTouch = 0;
        let lastFocused = null;
        let drawnPrize = giftState.lastPrize;
        let drawing = false;
        let giftTimer = null;
        let activeGiftRound = 0;
        function addGiftCard(prize, index, surprise = false) {
            if (giftCards.has(prize.id)) return giftCards.get(prize.id);
            const card = document.createElement('li');
            card.className = surprise ? 'gift-card gift-card-surprise' : 'gift-card';
            if (prize.isRetry) card.classList.add('gift-card-retry');
            card.dataset.prizeId = prize.id;
            const number = document.createElement('span');
            number.className = 'gift-card-number';
            number.textContent = surprise ? '✦' : (prize.isRetry ? '♡'
                : String(prizes.slice(0, index + 1).filter(item => !item.isRetry).length).padStart(2, '0'));
            const name = document.createElement('span');
            name.className = 'gift-card-name';
            name.textContent = prize.name;
            const state = document.createElement('span');
            state.className = 'gift-card-state';
            state.hidden = true;
            state.textContent = '已抽中';
            card.append(number, name, state);
            giftPool.append(card);
            giftCards.set(prize.id, card);
            return card;
        }
        prizes.forEach((prize, index) => addGiftCard(prize, index));

        function updateGiftTestCount() {
            giftTestCount.textContent = `已抽 ${giftState.history.length} / ${giftGame.maxDraws} 次`;
        }

        function removeSurprise() {
            giftCards.get(giftGame.surprisePrize.id)?.remove();
            giftCards.delete(giftGame.surprisePrize.id);
            giftPaper.classList.remove('has-surprise', 'is-surprise-reveal');
        }

        function revealSurprise(animate = false) {
            const alreadyVisible = giftCards.has(giftGame.surprisePrize.id);
            const card = addGiftCard(giftGame.surprisePrize, prizes.length, true);
            giftPaper.classList.add('has-surprise');
            card.classList.add('without-entrance');
            if (animate && !alreadyVisible) {
                giftPaper.classList.add('is-surprise-reveal');
                const content = giftPaper.querySelector('.gift-content');
                content.scrollTo({ top: content.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
            }
        }

        function showGiftResult(animateSurprise = false) {
            giftPaper.classList.remove('is-surprise-reveal');
            if (giftState.surpriseUnlocked) revealSurprise(animateSurprise);
            else removeSurprise();
            updateGiftTestCount();
            giftPaper.classList.toggle('is-revealed', Boolean(drawnPrize));
            giftResult.hidden = !drawnPrize;
            giftResultName.textContent = drawnPrize?.name || '';
            giftDraw.disabled = !prizes.length;
            giftDraw.textContent = giftState.remaining === 0
                ? '收好这些惊喜'
                : (drawnPrize ? '再拆一份惊喜' : '拆开生日礼物');
            giftTrigger.setAttribute('aria-label', drawnPrize
                ? (drawnPrize.isRetry ? '继续抽取生日礼物' : '查看抽中的生日礼物')
                : '抽取生日礼物');
            giftCards.forEach((card, id) => {
                const winner = id === drawnPrize?.id;
                const collected = id !== giftGame.retryPrize?.id && giftState.history.includes(id);
                card.classList.remove('is-active');
                card.classList.toggle('is-winner', winner);
                card.classList.toggle('is-collected', collected);
                card.querySelector('.gift-card-state').hidden = !collected;
            });
            if (!giftState.saved && drawnPrize) {
                giftStatus.textContent = '本次打开期间会为你保留抽取进度。';
            } else if (giftState.surpriseUnlocked) {
                giftStatus.textContent = '';
            } else {
                giftStatus.textContent = drawnPrize
                    ? (drawnPrize.isRetry ? '再拆一次，看看会有什么惊喜。' : `抽中了${drawnPrize.name}，再拆一份惊喜吧。`)
                    : (prizes.length ? '每一份礼物，都藏着一份心意。' : '礼物正在准备中。');
            }
        }

        showGiftResult();

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function heartShape(size) {
            ctx.beginPath();
            ctx.moveTo(0, size * 0.3);
            ctx.bezierCurveTo(0, -size * 0.2, -size * 0.6, -size * 0.2, -size * 0.5, size * 0.2);
            ctx.bezierCurveTo(-size * 0.4, size * 0.6, 0, size * 0.8, 0, size);
            ctx.bezierCurveTo(0, size * 0.8, size * 0.4, size * 0.6, size * 0.5, size * 0.2);
            ctx.bezierCurveTo(size * 0.6, -size * 0.2, 0, -size * 0.2, 0, size * 0.3);
            ctx.closePath();
        }

        function spawn(x, y, amount = 5) {
            for (let index = 0; index < amount; index++) {
                const angle = Math.PI * 2 * index / amount + Math.random() * 0.45;
                particles.push({
                    x,
                    y,
                    size: 13 + Math.random() * 13,
                    vx: Math.cos(angle) * (1.3 + Math.random() * 1.8),
                    vy: Math.sin(angle) * (1.3 + Math.random() * 1.8) - 1.7,
                    life: 1,
                    decay: 0.012 + Math.random() * 0.012,
                    angle: (Math.random() - 0.5) * 0.5,
                    spin: (Math.random() - 0.5) * 0.05,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(particle => particle.life > 0);
            particles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.05;
                particle.vx *= 0.99;
                particle.angle += particle.spin;
                particle.life -= particle.decay;
                ctx.save();
                ctx.globalAlpha = Math.max(0, particle.life);
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.angle);
                ctx.fillStyle = particle.color;
                heartShape(particle.size);
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = 'rgba(108, 54, 62, 0.48)';
                ctx.stroke();
                ctx.restore();
            });
            requestAnimationFrame(animate);
        }
        animate();

        function isProtectedTarget(target) {
            return target instanceof Element && Boolean(target.closest('.back-link, .letter-trigger, .letter-dialog, .gift-trigger, .gift-dialog'));
        }

        function revealCelebration() {
            document.body.classList.add('celebration-ready');
            panel.inert = false;
            panel.setAttribute('aria-hidden', 'false');
            status.textContent = '生日主界面已经打开';
        }

        function handleInteraction(x, y, target) {
            if (isProtectedTarget(target)) return;
            if (extinguished) {
                spawn(x, y, 6);
                return;
            }

            spawn(x, y, 13);
            extinguished = true;
            document.body.classList.add('candles-out');
            status.textContent = '蜡烛已经熄灭';
            window.setTimeout(revealCelebration, reduced ? 80 : 2100);
        }

        function openDialog(dialog, focusTarget) {
            lastFocused = document.activeElement;
            dialog.hidden = false;
            stage.inert = true;
            backLink.inert = true;
            focusTarget.focus({ preventScroll: true });
        }

        function closeDialog(dialog) {
            if (dialog.hidden) return;
            dialog.hidden = true;
            stage.inert = false;
            backLink.inert = false;
            lastFocused?.focus({ preventScroll: true });
        }

        function finishGiftDraw(celebrate = true) {
            window.clearTimeout(giftTimer);
            giftTimer = null;
            drawing = false;
            giftPaper.classList.remove('is-drawing');
            giftPool.setAttribute('aria-busy', 'false');
            showGiftResult(celebrate && !reduced && !giftDialog.hidden);
            if (celebrate && !giftDialog.hidden) {
                const rect = giftResult.getBoundingClientRect();
                spawn(rect.left + rect.width / 2, rect.top + rect.height / 2, reduced ? 5 : 18);
            }
        }

        function closeGift() {
            // 第三次的六秒悬念会继续计时，关闭重开也不会提前揭晓。
            if (drawing && !giftState.surpriseUnlocked) finishGiftDraw(false);
            closeDialog(giftDialog);
        }

        function resetGiftDraw() {
            activeGiftRound++;
            window.clearTimeout(giftTimer);
            giftTimer = null;
            drawing = false;
            giftState = giftGame.reset();
            drawnPrize = null;
            giftPaper.classList.remove('is-drawing', 'is-revealed');
            giftPool.setAttribute('aria-busy', 'false');
            showGiftResult();
            giftPaper.querySelector('.gift-content').scrollTop = 0;
            giftStatus.textContent = '已重置为 0 次，可以重新测试抽奖。';
        }

        function setActiveGift(id) {
            giftCards.forEach((card, prizeId) => card.classList.toggle('is-active', prizeId === id));
        }

        function runGiftLoop(pool, winnerId, duration, onComplete) {
            const round = activeGiftRound;
            const startedAt = performance.now();
            const totalSteps = Math.ceil(duration / 100);
            const weights = Array.from({ length: totalSteps }, (_, index) =>
                50 + 150 * Math.pow(index / (totalSteps - 1), 3));
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let step = 0;
            let elapsedWeight = 0;
            let previousId = '';

            function complete() {
                if (round !== activeGiftRound || !drawing) return;
                onComplete();
            }

            function advance() {
                if (round !== activeGiftRound || !drawing) return;
                if (performance.now() - startedAt >= duration) {
                    complete();
                    return;
                }
                // 每次随机跳到另一格，最后一跳才落到本次结果。
                const candidates = pool.filter(prize => prize.id !== previousId
                    && (step !== totalSteps - 2 || prize.id !== winnerId));
                const nextPrize = step === totalSteps - 1 && winnerId
                    ? pool.find(prize => prize.id === winnerId)
                    : candidates[Math.floor(Math.random() * candidates.length)];
                previousId = nextPrize.id;
                setActiveGift(nextPrize.id);
                elapsedWeight += weights[step++];
                const nextAt = startedAt + duration * elapsedWeight / totalWeight;
                giftTimer = window.setTimeout(step >= totalSteps ? complete : advance,
                    Math.max(0, nextAt - performance.now()));
            }

            if (reduced) {
                giftTimer = window.setTimeout(complete, duration);
                return;
            }
            advance();
        }

        function drawGift() {
            if (drawing || !prizes.length) return;
            const outcome = giftGame.draw();
            giftState = outcome;
            if (!outcome.added) {
                drawnPrize = giftState.lastPrize;
                showGiftResult();
                closeGift();
                return;
            }
            drawnPrize = outcome.prize;
            activeGiftRound++;
            drawing = true;
            updateGiftTestCount();
            giftResult.hidden = true;
            giftPaper.classList.remove('is-revealed', 'is-surprise-reveal');
            giftCards.forEach(card => card.classList.remove('is-winner', 'is-active'));
            giftDraw.disabled = true;
            giftDraw.textContent = '正在挑选你的惊喜…';
            giftStatus.textContent = '礼物正在悄悄打开…';
            giftPaper.classList.add('is-drawing');
            giftPool.setAttribute('aria-busy', 'true');
            if (outcome.isSurprise) {
                // 六秒内只随机跳转基础九宫格，特殊礼物出现时直接抽中。
                runGiftLoop(prizes, null, 6000, finishGiftDraw);
            } else {
                runGiftLoop(prizes, drawnPrize.id, 5000, finishGiftDraw);
            }
        }

        window.addEventListener('click', event => {
            if (Date.now() - lastTouch < 600) return;
            handleInteraction(event.clientX, event.clientY, event.target);
        });
        window.addEventListener('touchstart', event => {
            lastTouch = Date.now();
            const touch = event.touches[0];
            handleInteraction(touch.clientX, touch.clientY, event.target);
        }, { passive: true });

        letterTrigger.addEventListener('click', event => {
            event.stopPropagation();
            openDialog(letterDialog, letterClose);
        });
        letterClose.addEventListener('click', event => {
            event.stopPropagation();
            closeDialog(letterDialog);
        });
        letterDialog.addEventListener('click', event => {
            if (event.target === letterDialog) closeDialog(letterDialog);
        });
        giftTrigger.addEventListener('click', event => {
            event.stopPropagation();
            if (!drawing) {
                giftState = giftGame.read();
                drawnPrize = giftState.lastPrize;
                showGiftResult();
            }
            openDialog(giftDialog, giftClose);
        });
        giftClose.addEventListener('click', closeGift);
        giftDraw.addEventListener('click', drawGift);
        giftReset.addEventListener('click', resetGiftDraw);
        giftDialog.addEventListener('click', event => {
            if (event.target === giftDialog) closeGift();
        });
        window.addEventListener('storage', event => {
            if (event.key !== 'jy-gzc-birthday-gift' || drawing) return;
            giftState = giftGame.read();
            drawnPrize = giftState.lastPrize;
            showGiftResult();
        });
        window.addEventListener('keydown', event => {
            const dialog = !giftDialog.hidden ? giftDialog : (!letterDialog.hidden ? letterDialog : null);
            if (!dialog) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                if (dialog === giftDialog) closeGift();
                else closeDialog(letterDialog);
            }
            if (event.key === 'Tab') {
                const buttons = Array.from(dialog.querySelectorAll('button:not(:disabled), a[href]'));
                const first = buttons[0];
                const last = buttons[buttons.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });
    })();
    </script>
</body>
</html>
