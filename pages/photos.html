<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的相册</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #fff8e7 0%, #ffeeba 45%, #ffd180 100%);
        }
        body {
            position: relative;
            color: #27343a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body.modal-open { overflow: hidden; }
        [hidden] { display: none !important; }
        button { font: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid #a25145;
            outline-offset: 4px;
        }
        .album-shell {
            position: relative;
            z-index: 2;
            width: min(100% - 40px, 1100px);
            margin: 0 auto;
            padding-bottom: 90px;
        }
        .album-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 76px;
            border-bottom: 1px solid rgba(94, 76, 46, 0.22);
        }
        .album-nav a {
            color: #27343a;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
        }
        .album-nav a:hover { color: #a25145; }
        .album-brand { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .section-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            padding: 54px 0 30px;
        }
        .section-head h1 {
            margin: 0;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 39px;
            font-weight: 600;
            line-height: 1.2;
        }
        .section-head p {
            margin: 9px 0 0;
            color: #735e4e;
            font-size: 13px;
        }
        .section-index {
            color: #735e4e;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }
        .category-card {
            display: block;
            width: 100%;
            padding: 0;
            overflow: hidden;
            border: 1px solid rgba(108, 87, 52, 0.22);
            border-radius: 6px;
            background: rgba(255, 253, 245, 0.82);
            color: inherit;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(107, 72, 26, 0.09);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 36px rgba(107, 72, 26, 0.15);
        }
        .category-preview {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 3px;
            width: 100%;
            aspect-ratio: 1.52;
            overflow: hidden;
            background: #efd4a4;
        }
        .category-card:nth-child(2) .category-preview { grid-template-columns: 0.75fr 1.25fr; }
        .category-preview img {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            object-fit: cover;
            transition: transform 0.45s ease;
        }
        .category-card:hover img { transform: scale(1.04); }
        .category-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 23px 25px 25px;
        }
        .category-info strong {
            display: block;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 25px;
            font-weight: 600;
        }
        .category-info small {
            display: block;
            margin-top: 7px;
            color: #76685b;
            font-size: 12px;
        }
        .category-arrow { color: #a25145; font-size: 28px; line-height: 1; }
        .gallery-head { padding: 42px 0 28px; }
        .gallery-head .section-head { padding: 0; margin-top: 20px; }
        .back-button {
            padding: 0;
            border: 0;
            background: none;
            color: #7a5142;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .gallery-head h1 { margin-top: 18px; }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .photo-tile {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            text-align: left;
            cursor: zoom-in;
        }
        .photo-tile img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 0 10px 28px rgba(80, 63, 35, 0.12);
            transition: transform 0.25s ease;
        }
        .photo-tile:hover img { transform: translateY(-4px); }
        .photo-tile span {
            display: block;
            padding-top: 12px;
            color: #735e4e;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        .intro-overlay, .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(28, 34, 37, 0.96);
            color: #fff9eb;
        }
        .intro-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: min(100%, 680px);
            margin-bottom: 22px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .intro-top strong { font-weight: 600; }
        .icon-button {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 1px solid rgba(255, 249, 235, 0.55);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff9eb;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-button:hover { background: rgba(255, 255, 255, 0.2); }
        .intro-photo {
            display: block;
            width: min(72vw, 65vh, 680px);
            aspect-ratio: 1;
            object-fit: contain;
            background: #1e272b;
        }
        .intro-photo.flash { animation: photoFlash 0.13s ease-out; }
        @keyframes photoFlash {
            from { opacity: 0.55; transform: scale(0.985); }
            to { opacity: 1; transform: scale(1); }
        }
        .intro-progress {
            width: min(100%, 680px);
            height: 2px;
            margin-top: 22px;
            background: rgba(255, 249, 235, 0.25);
        }
        .intro-progress span {
            display: block;
            width: 0;
            height: 100%;
            background: #ffc76a;
            transition: width 0.12s linear;
        }
        .lightbox {
            z-index: 110;
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) 48px;
            gap: 18px;
        }
        .lightbox-close { position: absolute; top: 22px; right: 22px; }
        .lightbox figure {
            grid-column: 2;
            width: 100%;
            max-width: 740px;
            margin: auto;
            text-align: center;
        }
        .lightbox img {
            display: block;
            width: 100%;
            max-height: 76vh;
            object-fit: contain;
        }
        .lightbox figcaption {
            margin-top: 15px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .lightbox-prev { grid-column: 1; grid-row: 1; justify-self: end; }
        .lightbox-next { grid-column: 3; grid-row: 1; justify-self: start; }
        @media (max-width: 700px) {
            .album-shell { width: min(100% - 32px, 520px); }
            .album-nav { min-height: 64px; }
            .section-head { padding: 38px 0 24px; }
            .section-head h1 { font-size: 32px; }
            .category-grid { grid-template-columns: 1fr; gap: 18px; }
            .category-preview { aspect-ratio: 1.6; }
            .category-info { padding: 18px 20px 20px; }
            .category-info strong { font-size: 23px; }
            .photo-grid { gap: 12px; }
            .intro-photo { width: min(90vw, 58vh); }
            .lightbox { grid-template-columns: 38px minmax(0, 1fr) 38px; gap: 4px; padding: 16px; }
            .lightbox .icon-button { width: 36px; height: 36px; font-size: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .category-card, .category-preview img, .photo-tile img, .intro-photo, .intro-progress span {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="album-shell">
        <nav class="album-nav" aria-label="相册导航">
            <a href="../index.html">← 返回主页</a>
            <span class="album-brand">JY × GZC / MEMORIES</span>
        </nav>

        <main>
            <section id="categoriesView" aria-labelledby="albumTitle">
                <header class="section-head">
                    <div>
                        <h1 id="albumTitle">我们的相册</h1>
                        <p>两种收藏 · 同样的两张照片</p>
                    </div>
                    <span class="section-index">01 / 02</span>
                </header>
                <div class="category-grid">
                    <button class="category-card" type="button" data-category="moments">
                        <span class="category-preview">
                            <img src="../assets/gzc_jy_Img/HeadIcon1.jpg" alt="拥抱皮卡丘的插画">
                            <img src="../assets/gzc_jy_Img/HeadIcon2.jpg" alt="海边的照片">
                        </span>
                        <span class="category-info">
                            <span><strong>心动片段</strong><small>02 张照片</small></span>
                            <span class="category-arrow" aria-hidden="true">→</span>
                        </span>
                    </button>
                    <button class="category-card" type="button" data-category="scenery">
                        <span class="category-preview">
                            <img src="../assets/gzc_jy_Img/HeadIcon1.jpg" alt="拥抱皮卡丘的插画">
                            <img src="../assets/gzc_jy_Img/HeadIcon2.jpg" alt="海边的照片">
                        </span>
                        <span class="category-info">
                            <span><strong>沿途风景</strong><small>02 张照片</small></span>
                            <span class="category-arrow" aria-hidden="true">→</span>
                        </span>
                    </button>
                </div>
            </section>

            <section id="galleryView" hidden aria-labelledby="galleryTitle">
                <header class="gallery-head">
                    <button id="backToCategories" class="back-button" type="button">← 所有分类</button>
                    <div class="section-head">
                        <div>
                            <h1 id="galleryTitle" tabindex="-1"></h1>
                            <p>02 张照片</p>
                        </div>
                        <span class="section-index">01 / 02</span>
                    </div>
                </header>
                <div id="photoGrid" class="photo-grid"></div>
            </section>
        </main>
    </div>

    <div id="introOverlay" class="intro-overlay" role="dialog" aria-modal="true" aria-label="相册开场轮播" hidden>
        <div class="intro-top">
            <strong id="introTitle"></strong>
            <span id="introCounter" aria-live="off">01 / 15</span>
            <button id="skipIntro" class="icon-button" type="button" aria-label="跳过轮播" title="跳过轮播">×</button>
        </div>
        <img id="introPhoto" class="intro-photo" alt="">
        <div class="intro-progress" aria-hidden="true"><span id="introProgress"></span></div>
    </div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="查看照片" hidden>
        <button id="closeLightbox" class="icon-button lightbox-close" type="button" aria-label="关闭照片" title="关闭照片">×</button>
        <button id="prevPhoto" class="icon-button lightbox-prev" type="button" aria-label="上一张照片" title="上一张照片">‹</button>
        <figure>
            <img id="lightboxPhoto" alt="">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>
        <button id="nextPhoto" class="icon-button lightbox-next" type="button" aria-label="下一张照片" title="下一张照片">›</button>
    </div>

    <!-- 背景飘落爱心 -->
    <script>
    (function () {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        function resize() {
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width  = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        const palette = ['#ffd700', '#ffca28', '#ffb300', '#ffc107', '#ff9800'];
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const PARTICLE_COUNT = isMobile ? 22 : 50;

        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 2,
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function drawHeart(x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.5);
            ctx.bezierCurveTo(x - s, y + s, x, y + s * 1.3, x, y + s * 1.5);
            ctx.bezierCurveTo(x, y + s * 1.3, x + s, y + s, x + s, y + s * 0.5);
            ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = window.innerWidth;
                if (p.x > window.innerWidth) p.x = 0;
                if (p.y > window.innerHeight) {
                    p.y = -10;
                    p.x = Math.random() * window.innerWidth;
                }
                drawHeart(p.x, p.y, p.r, p.color, p.alpha);
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

    <!-- 点击爱心特效 -->
    <script>
    (function () {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        let particles = [];

        function resize() {
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width  = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        function heartShape(s) {
            ctx.beginPath();
            ctx.moveTo(0, s * 0.3);
            ctx.bezierCurveTo(0, -s * 0.2, -s * 0.6, -s * 0.2, -s * 0.5, s * 0.2);
            ctx.bezierCurveTo(-s * 0.4, s * 0.6, 0, s * 0.8, 0, s);
            ctx.bezierCurveTo(0, s * 0.8, s * 0.4, s * 0.6, s * 0.5, s * 0.2);
            ctx.bezierCurveTo(s * 0.6, -s * 0.2, 0, -s * 0.2, 0, s * 0.3);
            ctx.closePath();
        }

        const yellows = ['#ffd700', '#ffca28', '#ffb300', '#ffc107', '#ff9800'];

        function Particle(x, y) {
            this.x = x; this.y = y;
            this.size = 12 + Math.random() * 12;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -(2 + Math.random() * 2.5);
            this.life = 1;
            this.decay = 0.01 + Math.random() * 0.012;
            this.angle = (Math.random() - 0.5) * 0.6;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.color = yellows[Math.floor(Math.random() * yellows.length)];
        }
        Particle.prototype.update = function () {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; this.vx *= 0.99;
            this.angle += this.spin; this.life -= this.decay;
        };
        Particle.prototype.draw = function () {
            ctx.save();
            ctx.globalAlpha = Math.max(this.life, 0);
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color;
            heartShape(this.size);
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(200, 50, 10, 0.5)';
            ctx.stroke();
            ctx.restore();
        };

        function spawn(x, y) {
            const n = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < n; i++) {
                const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
                const r = Math.random() * 8;
                const p = new Particle(x + Math.cos(a) * r, y + Math.sin(a) * r);
                p.vx = Math.cos(a) * (1.2 + Math.random() * 1.5);
                p.vy = Math.sin(a) * (1.2 + Math.random() * 1.5) - 1.5;
                particles.push(p);
            }
        }

        let lastTouchTime = 0;
        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('click', e => {
            if (Date.now() - lastTouchTime < 600) return;
            spawn(e.clientX, e.clientY);
        });
        window.addEventListener('touchstart', e => {
            lastTouchTime = Date.now();
            const t = e.touches[0];
            spawn(t.clientX, t.clientY);
        }, { passive: true });
    })();
    </script>

    <script>
    (function () {
        const photos = [
            { src: '../assets/gzc_jy_Img/HeadIcon1.jpg', alt: '拥抱皮卡丘的插画' },
            { src: '../assets/gzc_jy_Img/HeadIcon2.jpg', alt: '海边的照片' }
        ];
        const categories = {
            moments: { title: '心动片段', photos },
            scenery: { title: '沿途风景', photos }
        };
        const categoriesView = document.getElementById('categoriesView');
        const galleryView = document.getElementById('galleryView');
        const galleryTitle = document.getElementById('galleryTitle');
        const photoGrid = document.getElementById('photoGrid');
        const introOverlay = document.getElementById('introOverlay');
        const introTitle = document.getElementById('introTitle');
        const introCounter = document.getElementById('introCounter');
        const introPhoto = document.getElementById('introPhoto');
        const introProgress = document.getElementById('introProgress');
        const lightbox = document.getElementById('lightbox');
        const lightboxPhoto = document.getElementById('lightboxPhoto');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const frameCount = 15;
        const frameDuration = 130;
        let activeCategory = null;
        let frameIndex = 0;
        let introTimer = null;
        let photoIndex = 0;
        let lastFocused = null;

        function renderGallery() {
            const category = categories[activeCategory];
            galleryTitle.textContent = category.title;
            photoGrid.replaceChildren(...category.photos.map((photo, index) => {
                const button = document.createElement('button');
                const image = document.createElement('img');
                const label = document.createElement('span');
                button.type = 'button';
                button.className = 'photo-tile';
                button.setAttribute('aria-label', `查看第 ${index + 1} 张照片`);
                button.dataset.index = index;
                image.src = photo.src;
                image.alt = photo.alt;
                image.loading = 'lazy';
                label.textContent = String(index + 1).padStart(2, '0') + ' / 02';
                button.append(image, label);
                return button;
            }));
            categoriesView.hidden = true;
            galleryView.hidden = false;
            window.scrollTo(0, 0);
            galleryTitle.focus();
        }

        function finishIntro() {
            clearTimeout(introTimer);
            introTimer = null;
            introOverlay.hidden = true;
            document.body.classList.remove('modal-open');
            renderGallery();
        }

        function showFrame() {
            const photo = categories[activeCategory].photos[frameIndex % photos.length];
            introPhoto.src = photo.src;
            introPhoto.alt = photo.alt;
            introCounter.textContent = String(frameIndex + 1).padStart(2, '0') + ' / 15';
            introProgress.style.width = ((frameIndex + 1) / frameCount * 100) + '%';
            introPhoto.classList.remove('flash');
            void introPhoto.offsetWidth;
            introPhoto.classList.add('flash');
            introTimer = setTimeout(() => {
                frameIndex++;
                if (frameIndex === frameCount) finishIntro();
                else showFrame();
            }, frameDuration);
        }

        function openCategory(id) {
            if (!categories[id]) return;
            activeCategory = id;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                renderGallery();
                return;
            }
            frameIndex = 0;
            introTitle.textContent = categories[id].title;
            introOverlay.hidden = false;
            document.body.classList.add('modal-open');
            document.getElementById('skipIntro').focus();
            showFrame();
        }

        function showLightbox() {
            const photo = categories[activeCategory].photos[photoIndex];
            lightboxPhoto.src = photo.src;
            lightboxPhoto.alt = photo.alt;
            lightboxCaption.textContent = String(photoIndex + 1).padStart(2, '0') + ' / 02';
        }

        function openLightbox(index) {
            lastFocused = document.activeElement;
            photoIndex = index;
            showLightbox();
            lightbox.hidden = false;
            document.body.classList.add('modal-open');
            document.getElementById('closeLightbox').focus();
        }

        function closeLightbox() {
            lightbox.hidden = true;
            document.body.classList.remove('modal-open');
            lastFocused?.focus();
        }

        function stepPhoto(direction) {
            const length = categories[activeCategory].photos.length;
            photoIndex = (photoIndex + direction + length) % length;
            showLightbox();
        }

        document.querySelectorAll('.category-card').forEach(button => {
            button.addEventListener('click', () => openCategory(button.dataset.category));
        });
        document.getElementById('skipIntro').addEventListener('click', finishIntro);
        document.getElementById('backToCategories').addEventListener('click', () => {
            const category = activeCategory;
            galleryView.hidden = true;
            categoriesView.hidden = false;
            activeCategory = null;
            window.scrollTo(0, 0);
            document.querySelector(`.category-card[data-category="${category}"]`)?.focus();
        });
        photoGrid.addEventListener('click', event => {
            const tile = event.target.closest('.photo-tile');
            if (tile) openLightbox(Number(tile.dataset.index));
        });
        document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
        document.getElementById('prevPhoto').addEventListener('click', () => stepPhoto(-1));
        document.getElementById('nextPhoto').addEventListener('click', () => stepPhoto(1));
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) closeLightbox();
        });
        window.addEventListener('keydown', event => {
            if (!lightbox.hidden) {
                if (event.key === 'Escape') closeLightbox();
                if (event.key === 'ArrowLeft') stepPhoto(-1);
                if (event.key === 'ArrowRight') stepPhoto(1);
            } else if (!introOverlay.hidden && event.key === 'Escape') {
                finishIntro();
            }
        });
    })();
    </script>

</body>
</html>
