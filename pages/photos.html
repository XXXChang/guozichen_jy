<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的相册</title>
    <style>
        :root {
            --ink: #493b37;
            --muted: #806f67;
            --line: rgba(130, 97, 67, 0.23);
            --paper: #fffaf1;
            --rose: #b96772;
            --teal: #557e77;
            --gold: #a87335;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #fff8e7 0%, #ffeeba 45%, #ffd180 100%);
        }
        body {
            position: relative;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(116, 85, 60, 0.09) 0.7px, transparent 0.7px);
            background-size: 4px 4px;
            opacity: 0.45;
        }
        body.modal-open { overflow: hidden; }
        [hidden] { display: none !important; }
        button { font: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--rose);
            outline-offset: 4px;
        }
        .album-shell {
            position: relative;
            z-index: 2;
            width: min(100% - 48px, 1100px);
            margin: 0 auto;
            padding-bottom: 90px;
        }
        .album-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 78px;
            border-bottom: 1px solid var(--line);
        }
        .album-nav a {
            color: var(--ink);
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
        }
        .album-nav a:hover { color: var(--rose); }
        .album-brand {
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
        .section-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            padding: 58px 0 30px;
        }
        .section-kicker {
            display: block;
            margin-bottom: 12px;
            color: var(--teal);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .section-head h1 {
            margin: 0;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 46px;
            font-weight: 600;
            line-height: 1.2;
        }
        .section-head p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .section-index {
            padding-bottom: 5px;
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
            align-items: start;
        }
        .category-card {
            display: block;
            width: 100%;
            padding: 10px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(255, 250, 241, 0.9);
            color: inherit;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 16px 34px rgba(107, 72, 26, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .category-card:nth-child(2) { margin-top: 36px; }
        .category-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 24px 42px rgba(107, 72, 26, 0.17);
        }
        .category-preview {
            position: relative;
            display: grid;
            grid-template-columns: 1.45fr 0.55fr;
            gap: 4px;
            width: 100%;
            aspect-ratio: 1.3;
            overflow: hidden;
            background: #efd4a4;
        }
        .category-preview img {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            object-fit: cover;
            transition: transform 0.45s ease;
        }
        .category-card:hover img { transform: scale(1.04); }
        .category-number {
            position: absolute;
            z-index: 1;
            top: 16px;
            left: 16px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 250, 241, 0.9);
            background: rgba(73, 59, 55, 0.76);
            color: var(--paper);
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .category-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 21px 15px 13px;
        }
        .category-info strong {
            display: block;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: 27px;
            font-weight: 600;
        }
        .category-info small {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }
        .category-subtitle {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 12px;
        }
        .category-meta {
            display: block;
            margin-top: 5px;
            color: var(--gold);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }
        .category-arrow {
            display: grid;
            place-items: center;
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 50%;
            color: var(--rose);
            font-size: 22px;
            line-height: 1;
            transition: color 0.25s ease, background 0.25s ease, transform 0.25s ease;
        }
        .category-card:hover .category-arrow {
            background: var(--rose);
            color: white;
            transform: translateX(3px);
        }
        .gallery-head { padding: 42px 0 30px; }
        .gallery-head .section-head { padding: 0; margin-top: 28px; }
        .back-button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--teal);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .back-button:hover { color: var(--rose); }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
        }
        .photo-tile {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--paper);
            color: inherit;
            text-align: left;
            cursor: zoom-in;
            box-shadow: 0 13px 30px rgba(80, 63, 35, 0.1);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .photo-tile img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .photo-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 36px rgba(80, 63, 35, 0.16);
        }
        .photo-tile span {
            display: flex;
            justify-content: space-between;
            padding: 14px 4px 5px;
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        .photo-tile span::before { content: "影像"; color: var(--gold); }
        .intro-overlay, .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(42, 35, 34, 0.97);
            color: var(--paper);
        }
        .intro-overlay {
            --intro-size: min(72vw, 65vh, 680px);
        }
        .intro-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: var(--intro-size);
            margin-bottom: 18px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .intro-top strong { font-weight: 600; }
        .icon-button {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 1px solid rgba(255, 249, 235, 0.55);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff9eb;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-button:hover { background: rgba(255, 255, 255, 0.2); }
        .intro-photo {
            display: block;
            width: var(--intro-size);
            aspect-ratio: 1;
            object-fit: contain;
            border: 8px solid var(--paper);
            border-radius: 3px;
            background: var(--paper);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
        }
        .intro-photo.flash { animation: photoFlash 0.13s cubic-bezier(.2,.75,.25,1); }
        @keyframes photoFlash {
            from { opacity: 0.42; transform: scale(1.14); }
            to { opacity: 1; transform: scale(1); }
        }
        .intro-progress {
            width: var(--intro-size);
            height: 3px;
            margin-top: 20px;
            background: rgba(255, 249, 235, 0.25);
        }
        .intro-progress span {
            display: block;
            width: 0;
            height: 100%;
            background: #ffc76a;
            transition: width 0.12s linear;
        }
        .lightbox {
            z-index: 110;
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) 48px;
            gap: 18px;
        }
        .lightbox-back { position: absolute; top: 22px; left: 22px; }
        .lightbox-close { position: absolute; top: 22px; right: 22px; }
        .lightbox figure {
            grid-column: 2;
            width: 100%;
            max-width: 740px;
            margin: auto;
            text-align: center;
        }
        .lightbox img {
            display: block;
            width: 100%;
            max-height: 76vh;
            object-fit: contain;
            border: 8px solid var(--paper);
            border-radius: 3px;
            background: var(--paper);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
        }
        .lightbox figcaption {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            margin-top: 15px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .lightbox-story-link {
            color: #ffe0a5;
            font-size: 12px;
            font-weight: 650;
            text-decoration: none;
        }
        .lightbox-story-link:hover { color: #fff; }
        .lightbox-prev { grid-column: 1; grid-row: 1; justify-self: end; }
        .lightbox-next { grid-column: 3; grid-row: 1; justify-self: start; }
        @media (max-width: 700px) {
            .album-shell { width: min(100% - 32px, 520px); }
            .album-nav { min-height: 64px; }
            .section-head { padding: 38px 0 24px; }
            .section-head h1 { font-size: 36px; }
            .category-grid { grid-template-columns: 1fr; gap: 18px; }
            .category-card:nth-child(2) { margin-top: 0; }
            .category-preview { aspect-ratio: 1.5; }
            .category-info { padding: 17px 10px 10px; }
            .category-info strong { font-size: 23px; }
            .photo-grid { gap: 12px; }
            .photo-tile { padding: 6px; }
            .photo-tile span { padding: 10px 2px 3px; font-size: 11px; }
            .intro-overlay { --intro-size: min(90vw, 58vh); }
            .lightbox { grid-template-columns: 38px minmax(0, 1fr) 38px; gap: 4px; padding: 16px; }
            .lightbox .icon-button { width: 36px; height: 36px; font-size: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .category-card, .category-preview img, .category-arrow, .photo-tile, .intro-photo, .intro-progress span {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>

    </div>

    <script>
    (function () {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        function resize() {
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width  = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        const palette = ['#ffd700', '#ffca28', '#ffb300', '#ffc107', '#ff9800'];
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const PARTICLE_COUNT = isMobile ? 22 : 50;

        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 2,
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            color: palette[Math.floor(Math.random() * palette.length)]
        }));

        function drawHeart(x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.5);
            ctx.bezierCurveTo(x - s, y + s, x, y + s * 1.3, x, y + s * 1.5);
            ctx.bezierCurveTo(x, y + s * 1.3, x + s, y + s, x + s, y + s * 0.5);
            ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = window.innerWidth;
                if (p.x > window.innerWidth) p.x = 0;
                if (p.y > window.innerHeight) {
                    p.y = -10;
                    p.x = Math.random() * window.innerWidth;
                }
                drawHeart(p.x, p.y, p.r, p.color, p.alpha);
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

    <script>
    (function () {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        let particles = [];

        function resize() {
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width  = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });

        function heartShape(s) {
            ctx.beginPath();
            ctx.moveTo(0, s * 0.3);
            ctx.bezierCurveTo(0, -s * 0.2, -s * 0.6, -s * 0.2, -s * 0.5, s * 0.2);
            ctx.bezierCurveTo(-s * 0.4, s * 0.6, 0, s * 0.8, 0, s);
            ctx.bezierCurveTo(0, s * 0.8, s * 0.4, s * 0.6, s * 0.5, s * 0.2);
            ctx.bezierCurveTo(s * 0.6, -s * 0.2, 0, -s * 0.2, 0, s * 0.3);
            ctx.closePath();
        }

        const yellows = ['#ffd700', '#ffca28', '#ffb300', '#ffc107', '#ff9800'];

        function Particle(x, y) {
            this.x = x; this.y = y;
            this.size = 12 + Math.random() * 12;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -(2 + Math.random() * 2.5);
            this.life = 1;
            this.decay = 0.01 + Math.random() * 0.012;
            this.angle = (Math.random() - 0.5) * 0.6;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.color = yellows[Math.floor(Math.random() * yellows.length)];
        }
        Particle.prototype.update = function () {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; this.vx *= 0.99;
            this.angle += this.spin; this.life -= this.decay;
        };
        Particle.prototype.draw = function () {
            ctx.save();
            ctx.globalAlpha = Math.max(this.life, 0);
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color;
            heartShape(this.size);
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(200, 50, 10, 0.5)';
            ctx.stroke();
            ctx.restore();
        };

        function spawn(x, y) {
            const n = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < n; i++) {
                const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
                const r = Math.random() * 8;
                const p = new Particle(x + Math.cos(a) * r, y + Math.sin(a) * r);
                p.vx = Math.cos(a) * (1.2 + Math.random() * 1.5);
                p.vy = Math.sin(a) * (1.2 + Math.random() * 1.5) - 1.5;
                particles.push(p);
            }
        }

        let lastTouchTime = 0;
        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('click', e => {
            if (Date.now() - lastTouchTime < 600) return;
            spawn(e.clientX, e.clientY);
        });
        window.addEventListener('touchstart', e => {
            lastTouchTime = Date.now();
            const t = e.touches[0];
            spawn(t.clientX, t.clientY);
        }, { passive: true });
    })();
    </script>

    <script>
    (function () {
        const data = window.MEMORY_DATA || { albums: [], photos: [], events: [] };
        const photoById = new Map(data.photos.map(photo => [photo.id, photo]));
        const eventById = new Map(data.events.map(event => [event.id, event]));
        const albums = data.albums.map(album => ({
            ...album,
            photos: album.photoIds
                .map(id => photoById.get(id))
                .filter(Boolean)
                .sort((a, b) => {
                    const dateOrder = (b.date || '').localeCompare(a.date || '');
                    if (dateOrder !== 0) return dateOrder;
                    return (b.src || '').localeCompare(a.src || '', undefined, { numeric: true });
                })
        }));
        const introPhotos = Array.isArray(data.introImages) ? data.introImages : [];
        const albumById = new Map(albums.map(album => [album.id, album]));
        const albumShell = document.querySelector('.album-shell');
        const categoriesView = document.getElementById('categoriesView');
        const categoryGrid = document.getElementById('categoryGrid');
        const albumSummary = document.getElementById('albumSummary');
        const albumIndex = document.getElementById('albumIndex');
        const galleryView = document.getElementById('galleryView');
        const galleryTitle = document.getElementById('galleryTitle');
        const gallerySummary = document.getElementById('gallerySummary');
        const galleryIndex = document.getElementById('galleryIndex');
        const photoGrid = document.getElementById('photoGrid');
        const introOverlay = document.getElementById('introOverlay');
        const introTitle = document.getElementById('introTitle');
        const introCounter = document.getElementById('introCounter');
        const introPhoto = document.getElementById('introPhoto');
        const introProgress = document.getElementById('introProgress');
        const lightbox = document.getElementById('lightbox');
        const lightboxPhoto = document.getElementById('lightboxPhoto');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const lightboxStoryLink = document.getElementById('lightboxStoryLink');
        const frameCount = 15;
        const frameDuration = 130;
        let activeAlbumId = null;
        let frameIndex = 0;
        let introTimer = null;
        let photoIndex = 0;
        let lastFocused = null;
        let touchStart = null;

        const pad = value => String(value).padStart(2, '0');

        function resolvePhotoSrc(src) {
            if (/^(?:[a-z]+:|\/)/i.test(src) || src.startsWith('../')) return src;
            return '../' + src;
        }

        function formatDate(date) {
            return date ? date.replaceAll('-', '.') : '';
        }

        function getAlbumRange(album) {
            const dates = album.photos.map(photo => photo.date).filter(Boolean).sort();
            if (!dates.length) return '日期待补充';
            if (dates[0] === dates[dates.length - 1]) return formatDate(dates[0]);
            return `${formatDate(dates[0])} - ${formatDate(dates[dates.length - 1])}`;
        }

        function preloadPhotos(photos) {
            photos.forEach(photo => {
                const image = new Image();
                image.src = resolvePhotoSrc(photo.src);
            });
        }

        function preloadAlbum(album) {
            preloadPhotos(album.photos);
        }

        function renderCategories() {
            albumSummary.textContent = `${albums.length} 个分类 · ${data.photos.length} 张照片`;
            albumIndex.textContent = albums.length ? `01 / ${pad(albums.length)}` : '00 / 00';
            categoryGrid.replaceChildren(...albums.map((album, index) => {
                const button = document.createElement('button');
                const preview = document.createElement('span');
                const number = document.createElement('span');
                const info = document.createElement('span');
                const copy = document.createElement('span');
                const title = document.createElement('strong');
                const subtitle = document.createElement('span');
                const meta = document.createElement('span');
                const arrow = document.createElement('span');
                const cover = photoById.get(album.coverPhotoId) || album.photos[0];
                const previewPhotos = [cover, ...album.photos.filter(photo => photo.id !== cover?.id)].filter(Boolean);

                button.type = 'button';
                button.className = 'category-card';
                button.dataset.category = album.id;
                button.setAttribute('aria-label', `打开${album.title}，${album.photos.length}张照片`);
                preview.className = 'category-preview';
                previewPhotos.slice(0, 2).forEach((photo, photoPreviewIndex) => {
                    const image = document.createElement('img');
                    image.src = resolvePhotoSrc(photo.src);
                    image.alt = photo.alt;
                    if (photoPreviewIndex > 0) image.loading = 'lazy';
                    preview.appendChild(image);
                });
                number.className = 'category-number';
                number.setAttribute('aria-hidden', 'true');
                number.textContent = `NO. ${pad(index + 1)}`;
                preview.appendChild(number);

                info.className = 'category-info';
                title.textContent = album.title;
                subtitle.className = 'category-subtitle';
                subtitle.textContent = album.subtitle || '我们的影像收藏';
                meta.className = 'category-meta';
                meta.textContent = `${pad(album.photos.length)} 张照片 · ${getAlbumRange(album)}`;
                copy.append(title, subtitle, meta);
                arrow.className = 'category-arrow';
                arrow.setAttribute('aria-hidden', 'true');
                arrow.textContent = '→';
                info.append(copy, arrow);
                button.append(preview, info);
                return button;
            }));
        }

        function renderGallery({ focus = true } = {}) {
            const album = albumById.get(activeAlbumId);
            if (!album) return;
            const albumPosition = albums.findIndex(item => item.id === album.id);
            galleryTitle.textContent = album.title;
            gallerySummary.textContent = `${album.subtitle || '我们的影像收藏'} · ${pad(album.photos.length)} 张照片 · ${getAlbumRange(album)}`;
            galleryIndex.textContent = `${pad(albumPosition + 1)} / ${pad(albums.length)}`;
            photoGrid.replaceChildren(...album.photos.map((photo, index) => {
                const button = document.createElement('button');
                const image = document.createElement('img');
                const label = document.createElement('span');
                button.type = 'button';
                button.className = 'photo-tile';
                button.setAttribute('aria-label', `查看第 ${index + 1} 张照片`);
                button.dataset.index = index;
                button.dataset.photo = photo.id;
                image.src = resolvePhotoSrc(photo.src);
                image.alt = photo.alt;
                image.loading = index < 2 ? 'eager' : 'lazy';
                label.textContent = `${formatDate(photo.date)} · ${pad(index + 1)} / ${pad(album.photos.length)}`;
                button.append(image, label);
                return button;
            }));
            categoriesView.hidden = true;
            galleryView.hidden = false;
            window.scrollTo(0, 0);
            if (focus) galleryTitle.focus();
        }

        function finishIntro() {
            clearTimeout(introTimer);
            introTimer = null;
            introOverlay.hidden = true;
            document.body.classList.remove('modal-open');
            albumShell.inert = false;
            renderGallery();
        }

        function showFrame() {
            const album = albumById.get(activeAlbumId);
            const framePhotos = introPhotos.length ? introPhotos : album?.photos || [];
            if (!framePhotos.length) {
                finishIntro();
                return;
            }
            const photo = framePhotos[frameIndex % framePhotos.length];
            introPhoto.src = resolvePhotoSrc(photo.src);
            introPhoto.alt = photo.alt;
            introCounter.textContent = `${pad(frameIndex + 1)} / ${pad(frameCount)}`;
            introProgress.style.width = ((frameIndex + 1) / frameCount * 100) + '%';
            introPhoto.classList.remove('flash');
            void introPhoto.offsetWidth;
            introPhoto.classList.add('flash');
            introTimer = setTimeout(() => {
                frameIndex++;
                if (frameIndex === frameCount) finishIntro();
                else showFrame();
            }, frameDuration);
        }

        function openCategory(id, { playIntro = true, focus = true } = {}) {
            const album = albumById.get(id);
            if (!album) return;
            activeAlbumId = id;
            preloadAlbum(album);
            if (!playIntro || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                renderGallery({ focus });
                return;
            }
            clearTimeout(introTimer);
            if (!(introPhotos.length || album.photos.length)) {
                renderGallery();
                return;
            }
            frameIndex = 0;
            introProgress.style.width = '0%';
            introTitle.textContent = album.title;
            introOverlay.hidden = false;
            document.body.classList.add('modal-open');
            albumShell.inert = true;
            document.getElementById('skipIntro').focus();
            showFrame();
        }

        function showLightbox() {
            const album = albumById.get(activeAlbumId);
            const photo = album.photos[photoIndex];
            lightboxPhoto.src = resolvePhotoSrc(photo.src);
            lightboxPhoto.alt = photo.alt;
            lightboxCaption.textContent = `${formatDate(photo.date)} · ${pad(photoIndex + 1)} / ${pad(album.photos.length)}`;
            const linkedEvent = photo.eventId && eventById.get(photo.eventId);
            lightboxStoryLink.hidden = !linkedEvent;
            if (linkedEvent) {
                lightboxStoryLink.href = `story.html?event=${encodeURIComponent(linkedEvent.id)}`;
                lightboxStoryLink.textContent = `查看故事节点 · ${linkedEvent.title} ↗`;
            }
        }

        function openLightbox(index, { focus = true } = {}) {
            const album = albumById.get(activeAlbumId);
            if (!album?.photos[index]) return;
            lastFocused = focus ? document.activeElement : null;
            photoIndex = index;
            showLightbox();
            lightbox.hidden = false;
            document.body.classList.add('modal-open');
            albumShell.inert = true;
            if (focus) document.getElementById('closeLightbox').focus();
        }

        function closeLightbox({ restoreFocus = true } = {}) {
            lightbox.hidden = true;
            document.body.classList.remove('modal-open');
            albumShell.inert = false;
            if (restoreFocus) lastFocused?.focus();
        }

        function stepPhoto(direction) {
            const length = albumById.get(activeAlbumId).photos.length;
            photoIndex = (photoIndex + direction + length) % length;
            showLightbox();
        }

        categoryGrid.addEventListener('click', event => {
            const button = event.target.closest('.category-card');
            if (button) openCategory(button.dataset.category);
        });
        document.getElementById('skipIntro').addEventListener('click', finishIntro);
        function returnToCategories() {
            const album = activeAlbumId;
            if (!lightbox.hidden) closeLightbox({ restoreFocus: false });
            galleryView.hidden = true;
            categoriesView.hidden = false;
            activeAlbumId = null;
            window.scrollTo(0, 0);
            document.querySelector(`.category-card[data-category="${album}"]`)?.focus();
        }

        document.getElementById('backToCategories').addEventListener('click', returnToCategories);
        document.getElementById('backFromLightbox').addEventListener('click', returnToCategories);
        photoGrid.addEventListener('click', event => {
            const tile = event.target.closest('.photo-tile');
            if (tile) openLightbox(Number(tile.dataset.index));
        });
        document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
        document.getElementById('prevPhoto').addEventListener('click', () => stepPhoto(-1));
        document.getElementById('nextPhoto').addEventListener('click', () => stepPhoto(1));
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) closeLightbox();
        });
        lightbox.querySelector('figure').addEventListener('touchstart', event => {
            if (event.target.closest('a')) return;
            const touch = event.changedTouches[0];
            touchStart = { x: touch.clientX, y: touch.clientY };
        }, { passive: true });
        lightbox.querySelector('figure').addEventListener('touchend', event => {
            if (!touchStart || event.target.closest('a')) {
                touchStart = null;
                return;
            }
            const touch = event.changedTouches[0];
            const deltaX = touch.clientX - touchStart.x;
            const deltaY = touch.clientY - touchStart.y;
            touchStart = null;
            if (Math.abs(deltaX) >= 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
                stepPhoto(deltaX < 0 ? 1 : -1);
            }
        }, { passive: true });
        window.addEventListener('keydown', event => {
            if (!lightbox.hidden) {
                if (event.key === 'Escape') closeLightbox();
                if (event.key === 'ArrowLeft') stepPhoto(-1);
                if (event.key === 'ArrowRight') stepPhoto(1);
            } else if (!introOverlay.hidden && event.key === 'Escape') {
                finishIntro();
            }
        });

        function openFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const requestedEvent = eventById.get(params.get('event'));
            let requestedPhoto = photoById.get(params.get('photo'));
            let requestedAlbum = albumById.get(params.get('album'));

            if (!requestedPhoto && requestedEvent?.photoIds?.length) {
                requestedPhoto = photoById.get(requestedEvent.photoIds[0]);
            }
            if (!requestedAlbum && requestedPhoto) {
                requestedAlbum = albums.find(album => album.photoIds.includes(requestedPhoto.id));
            }
            if (!requestedAlbum && requestedEvent?.albumIds?.length) {
                requestedAlbum = requestedEvent.albumIds.map(id => albumById.get(id)).find(Boolean);
            }
            if (!requestedAlbum) return;

            openCategory(requestedAlbum.id, { playIntro: false, focus: false });
            if (requestedPhoto) {
                const requestedIndex = requestedAlbum.photos.findIndex(photo => photo.id === requestedPhoto.id);
                if (requestedIndex >= 0) openLightbox(requestedIndex, { focus: false });
            }
        }

        renderCategories();
        albums.forEach(preloadAlbum);
        preloadPhotos(introPhotos);
        openFromUrl();
    })();
    </script>
